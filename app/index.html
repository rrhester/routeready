<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- default, NOT black-translucent: translucent triggers the WebKit
       standalone bug where the web view sits at y=0 but is sized as if it
       started below the status bar — a dead, unpaintable strip one
       status-bar tall appears under the tab bar (probe-verified on a real
       Dynamic Island iPhone: vp 793 on an 852 screen, teal probe clipped).
       In default mode position and size agree: the app runs flush to the
       physical bottom, and iOS paints the status bar from theme-color
       (white — redesign 2026-07), which blends seamlessly with the light app header. Baked in at
       Add-to-Home-Screen time — takes effect on reinstall. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RouteReady">
  <meta name="format-detection" content="telephone=no">
  <title>RouteReady · Driver</title>
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Preload the app font: it's declared in rr-system.css (the second
       stylesheet), so without this hint the browser discovers it late and
       drivers on LTE watch system text swap to Inter mid-read. -->
  <link rel="preload" href="fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- Opaque, full-bleed 180px tile — iOS applies its own corner mask and
       fills transparency with black, so never give it alpha corners. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iOS launch screens (portrait; the manifest locks portrait). Without
       these iOS ignores background_color and flashes plain white on launch.
       Regenerate with scripts/generate-driver-icons.mjs when the icon changes. -->
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1320x2868.png">
