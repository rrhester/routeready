<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RouteReady">
  <defs>
    <!-- Dark navy tile, faint vertical lift toward the top -->
    <linearGradient id="rrBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16273F"/>
      <stop offset="1" stop-color="#0A1320"/>
    </linearGradient>
    <radialGradient id="rrSheen" cx="0.5" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#263C58" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#263C58" stop-opacity="0"/>
    </radialGradient>
    <!-- Brand blue (bright top -> deep bottom) for the route + active nodes -->
    <linearGradient id="rrBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#1E66E6"/>
    </linearGradient>
    <linearGradient id="rrWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F0F8"/>
    </linearGradient>
    <!-- Soft float shadow under the lit cells -->
    <filter id="rrCellShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#04070D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="108" fill="url(#rrBg)"/>
  <rect width="512" height="512" rx="108" fill="url(#rrSheen)"/>

  <!-- Dormant grid cells (the un-lit app tiles the route hasn't reached) -->
  <g fill="#A6C0DD" fill-opacity="0.24" stroke="#A6C0DD" stroke-opacity="0.18" stroke-width="2">
    <rect x="336" y="208" width="96" height="96" rx="24"/>
    <rect x="208" y="336" width="96" height="96" rx="24"/>
    <rect x="336" y="336" width="96" height="96" rx="24"/>
  </g>

  <!-- Route connectors (tuck under the lit cells) -->
  <g fill="none" stroke="url(#rrBlue)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 256 H384 V128"/>
    <path d="M128 384 H256 V256"/>
  </g>

  <!-- Lit cells -->
  <g filter="url(#rrCellShadow)">
    <g fill="url(#rrWhite)">
      <rect x="80" y="80" width="96" height="96" rx="24"/>
      <rect x="208" y="80" width="96" height="96" rx="24"/>
      <rect x="80" y="208" width="96" height="96" rx="24"/>
    </g>
    <rect x="204" y="204" width="104" height="104" rx="28" fill="url(#rrBlue)"/>
    <circle cx="384" cy="128" r="54" fill="url(#rrBlue)"/>
    <circle cx="128" cy="384" r="54" fill="url(#rrBlue)"/>
  </g>
</svg>
