<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="How to save RouteReady to your home screen on iPhone and Android">
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 14; }
      .platform { fill: #f3f4f6; rx: 12; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; font-weight: 700; fill: #111827; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; font-weight: 800; fill: #fff; }
      .step-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; font-weight: 500; fill: #374151; }
      .phone-shell { fill: #fff; stroke: #111827; stroke-width: 3; rx: 18; }
      .phone-screen { fill: #f9fafb; }
      .browser-bar { fill: #e5e7eb; }
      .browser-pill { fill: #fff; stroke: #d1d5db; stroke-width: 1; rx: 8; }
      .accent { fill: #2563eb; }
      .accent-soft { fill: #dbeafe; }
      .highlight { fill: none; stroke: #ef4444; stroke-width: 3; stroke-dasharray: 6 4; rx: 8; }
      .menu-row { fill: #fff; stroke: #e5e7eb; stroke-width: 1; }
      .menu-row.hot { fill: #dbeafe; }
      .arrow { fill: none; stroke: #ef4444; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; font-weight: 800; fill: #111827; }
    </style>
  </defs>

  <text x="320" y="36" text-anchor="middle" class="title" font-size="22">Save RouteReady to your home screen</text>

  <!-- ─── iOS panel ────────────────────────────────────────────────── -->
  <rect x="20" y="60" width="600" height="300" class="platform" />
  <text x="40" y="92" class="label" font-size="18"> iPhone (Safari)</text>

  <!-- iOS step 1 -->
  <g transform="translate(40,108)">
    <circle cx="14" cy="14" r="14" class="accent"/>
    <text x="14" y="20" class="step-num" font-size="16" text-anchor="middle">1</text>
    <text x="38" y="18" class="step-body" font-size="14">Open the welcome link in</text>
    <text x="38" y="36" class="step-body" font-size="14">Safari (not Chrome).</text>
  </g>

  <!-- iOS step 2 + phone illustration -->
  <g transform="translate(40,180)">
    <circle cx="14" cy="14" r="14" class="accent"/>
    <text x="14" y="20" class="step-num" font-size="16" text-anchor="middle">2</text>
    <text x="38" y="18" class="step-body" font-size="14">Tap the Share button at the</text>
    <text x="38" y="36" class="step-body" font-size="14">bottom of Safari.</text>
  </g>
  <g transform="translate(280,128)">
    <rect x="0" y="0" width="120" height="216" class="phone-shell"/>
    <rect x="6" y="22" width="108" height="172" class="phone-screen"/>
    <rect x="14" y="32" width="92" height="14" class="browser-pill"/>
    <text x="60" y="42" text-anchor="middle" class="step-body" font-size="9">gorouteready.com</text>
    <!-- Share icon at bottom -->
    <g transform="translate(48,194)">
      <rect x="0" y="0" width="24" height="22" rx="3" fill="#fff" stroke="#9ca3af"/>
      <!-- arrow up out of box -->
      <line x1="12" y1="3" x2="12" y2="14" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
      <polyline points="7,8 12,3 17,8" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="44" y="190" width="32" height="30" class="highlight"/>
  </g>

  <!-- iOS step 3 + share-sheet illustration -->
  <g transform="translate(40,252)">
    <circle cx="14" cy="14" r="14" class="accent"/>
    <text x="14" y="20" class="step-num" font-size="16" text-anchor="middle">3</text>
    <text x="38" y="18" class="step-body" font-size="14">Scroll down and tap</text>
    <text x="38" y="36" class="step-body" font-size="14">"Add to Home Screen."</text>
  </g>
  <g transform="translate(440,128)">
    <rect x="0" y="0" width="120" height="216" class="phone-shell"/>
    <rect x="6" y="22" width="108" height="172" class="phone-screen"/>
    <!-- share sheet header -->
    <rect x="6" y="22" width="108" height="22" fill="#e5e7eb"/>
    <text x="60" y="36" text-anchor="middle" class="step-body" font-size="9">Share</text>
    <!-- rows -->
    <rect x="10" y="50" width="100" height="20" class="menu-row" rx="4"/>
    <text x="18" y="63" class="step-body" font-size="9">Copy</text>
    <rect x="10" y="74" width="100" height="20" class="menu-row" rx="4"/>
    <text x="18" y="87" class="step-body" font-size="9">Add to Reading List</text>
    <rect x="10" y="98" width="100" height="20" class="menu-row hot" rx="4"/>
    <text x="18" y="111" class="step-body" font-size="9" font-weight="700">Add to Home Screen</text>
    <rect x="10" y="122" width="100" height="20" class="menu-row" rx="4"/>
    <text x="18" y="135" class="step-body" font-size="9">Markup</text>
    <rect x="10" y="146" width="100" height="20" class="menu-row" rx="4"/>
    <text x="18" y="159" class="step-body" font-size="9">Print</text>
    <rect x="8" y="96" width="104" height="24" class="highlight"/>
  </g>

  <!-- ─── Android panel ───────────────────────────────────────────── -->
  <rect x="20" y="380" width="600" height="320" class="platform" />
  <text x="40" y="412" class="label" font-size="18">🤖 Android (Chrome)</text>

  <!-- Android step 1 -->
  <g transform="translate(40,428)">
    <circle cx="14" cy="14" r="14" class="accent"/>
    <text x="14" y="20" class="step-num" font-size="16" text-anchor="middle">1</text>
    <text x="38" y="18" class="step-body" font-size="14">Open the welcome link in</text>
    <text x="38" y="36" class="step-body" font-size="14">Chrome.</text>
  </g>

  <!-- Android step 2 + phone illustration -->
  <g transform="translate(40,500)">
    <circle cx="14" cy="14" r="14" class="accent"/>
    <text x="14" y="20" class="step-num" font-size="16" text-anchor="middle">2</text>
    <text x="38" y="18" class="step-body" font-size="14">Tap the three-dot menu</text>
    <text x="38" y="36" class="step-body" font-size="14">at the top right.</text>
  </g>
  <g transform="translate(280,448)">
    <rect x="0" y="0" width="120" height="216" class="phone-shell"/>
    <rect x="6" y="22" width="108" height="172" class="phone-screen"/>
    <rect x="14" y="32" width="80" height="14" class="browser-pill"/>
    <text x="54" y="42" text-anchor="middle" class="step-body" font-size="9">gorouteready.com</text>
    <!-- 3-dot menu -->
    <g transform="translate(98,36)">
      <circle cx="0" cy="0" r="1.6" fill="#374151"/>
      <circle cx="0" cy="4" r="1.6" fill="#374151"/>
      <circle cx="0" cy="8" r="1.6" fill="#374151"/>
    </g>
    <rect x="92" y="30" width="14" height="20" class="highlight"/>
  </g>

  <!-- Android step 3 + menu illustration -->
  <g transform="translate(40,572)">
    <circle cx="14" cy="14" r="14" class="accent"/>
    <text x="14" y="20" class="step-num" font-size="16" text-anchor="middle">3</text>
    <text x="38" y="18" class="step-body" font-size="14">Tap "Install app" (or</text>
    <text x="38" y="36" class="step-body" font-size="14">"Add to Home screen").</text>
  </g>
  <g transform="translate(440,448)">
    <rect x="0" y="0" width="120" height="216" class="phone-shell"/>
    <rect x="6" y="22" width="108" height="172" class="phone-screen"/>
    <rect x="6" y="22" width="108" height="22" fill="#e5e7eb"/>
    <text x="60" y="36" text-anchor="middle" class="step-body" font-size="9">Menu</text>
    <rect x="10" y="50" width="100" height="20" class="menu-row" rx="4"/>
    <text x="18" y="63" class="step-body" font-size="9">New tab</text>
    <rect x="10" y="74" width="100" height="20" class="menu-row" rx="4"/>
    <text x="18" y="87" class="step-body" font-size="9">Bookmarks</text>
    <rect x="10" y="98" width="100" height="20" class="menu-row hot" rx="4"/>
    <text x="18" y="111" class="step-body" font-size="9" font-weight="700">Install app</text>
    <rect x="10" y="122" width="100" height="20" class="menu-row" rx="4"/>
    <text x="18" y="135" class="step-body" font-size="9">Settings</text>
    <rect x="10" y="146" width="100" height="20" class="menu-row" rx="4"/>
    <text x="18" y="159" class="step-body" font-size="9">Help</text>
    <rect x="8" y="96" width="104" height="24" class="highlight"/>
  </g>
</svg>
