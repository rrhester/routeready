<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Test Portal — Sign in</title></head>
<body>
  <!-- An auth wall: no applicant data, just a sign-in form. The agent should
       recognise it can't proceed and finish with status "blocked". -->
  <h1>Sign in</h1>
  <p>Please sign in to view applicants.</p>
  <form>
    <input type="email" placeholder="Work email" />
    <input type="password" placeholder="Password" />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
