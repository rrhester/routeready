# Short-path rewrites for applicant/driver-facing links. The original
# paths (/dashboard/screening.html?t=…) still resolve so previously-
# emailed/SMS'd links keep working; new sends from the DB use the
# shorter forms below.
#
# 200 = internal rewrite (URL bar stays on the short path).

[[redirects]]
  from = "/s/:token"
  to   = "/dashboard/screening.html?t=:token"
  status = 200

[[redirects]]
  from = "/c/:token"
  to   = "/dashboard/coaching.html?t=:token"
  status = 200

[[redirects]]
  from = "/r/:token"
  to   = "/dashboard/refer.html?r=:token"
  status = 200

# Old marketing pages consolidated into the landing. 301 so any
# externally-linked URLs (or Google's index) update over time.
[[redirects]]
  from = "/about.html"
  to   = "/"
  status = 301
  force = true

[[redirects]]
  from = "/how-it-works.html"
  to   = "/#how"
  status = 301
  force = true

# We had both privacy.html and privacy-policy.html. Keep privacy.html
# as canonical; redirect the long form to it.
[[redirects]]
  from = "/privacy-policy.html"
  to   = "/privacy.html"
  status = 301
  force = true

# Pretty URL for the desktop download landing page.
[[redirects]]
  from = "/download"
  to   = "/download.html"
  status = 200
