# Short-path rewrites for applicant/driver-facing links. The original
# paths (/dashboard/screening.html?t=…) still resolve so previously-
# emailed/SMS'd links keep working; new sends from the DB use the
# shorter forms below.
#
# 200 = internal rewrite (URL bar stays on the short path).

[[redirects]]
  from = "/s/:token"
  to   = "/dashboard/screening.html?t=:token"
  status = 200

# Repair Center — secure shop quote links (/q/<token> → shop portal).
[[redirects]]
  from = "/q/:token"
  to   = "/dashboard/shop.html?t=:token"
  status = 200

[[redirects]]
  from = "/c/:token"
  to   = "/dashboard/coaching.html?t=:token"
  status = 200

[[redirects]]
  from = "/r/:token"
  to   = "/dashboard/refer.html?r=:token"
  status = 200

# RouteReady Meet — short invite links (meet.js also parses the /m/<code>
# path directly, so the 200 rewrite works even though ?m= stays unset).
[[redirects]]
  from = "/m/:code"
  to   = "/dashboard/meet.html?m=:code"
  status = 200

[[redirects]]
  from = "/meet"
  to   = "/dashboard/meet.html"
  status = 200

# Old marketing pages consolidated into the landing. 301 so any
# externally-linked URLs (or Google's index) update over time.
[[redirects]]
  from = "/about.html"
  to   = "/"
  status = 301
  force = true

[[redirects]]
  from = "/how-it-works.html"
  to   = "/#how"
  status = 301
  force = true

# We had both privacy.html and privacy-policy.html. Keep privacy.html
# as canonical; redirect the long form to it.
[[redirects]]
  from = "/privacy-policy.html"
  to   = "/privacy.html"
  status = 301
  force = true

# Pretty URL for the desktop download landing page.
[[redirects]]
  from = "/download"
  to   = "/download.html"
  status = 200

# Pretty URL for the post-download "getting started" guide.
[[redirects]]
  from = "/installed"
  to   = "/installed.html"
  status = 200

# Public document-verification page. /verify/<signing_token> and a
# bare /verify both resolve to verify.html (which also reads ?token=).
[[redirects]]
  from = "/verify/:token"
  to   = "/verify.html?token=:token"
  status = 200

[[redirects]]
  from = "/verify"
  to   = "/verify.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────
# Build · auto cache-bust every static asset
# ─────────────────────────────────────────────────────────────────────
# scripts/bust-cache.mjs rewrites every `<asset>.{js,mjs,css}?v=...`
# token in our HTML + JS files to the deploy's COMMIT_REF before
# Netlify publishes. Without this, the `?v=...` tokens were
# hand-bumped per-PR — and forgotten — so operators kept loading
# stale JS even after a green deploy ("dashboard still shows old
# data" reports from 2026-05-24). Auto-rewriting makes
# "deploy = invalidate every cached asset" hold by construction.
#
# `publish = "."` keeps the publish root at the repo root, same as
# the implicit default before this block was added.

[build]
  command = "node scripts/bust-cache.mjs"
  publish = "."

# ─────────────────────────────────────────────────────────────────────
# Cache headers
# ─────────────────────────────────────────────────────────────────────
# dashboard/index.html (and its sibling pages) inline every stylesheet
# block in the dispatch dashboard — ~17k lines of CSS live inside the
# HTML itself.  Without explicit cache-control, Netlify's default
# behavior caches the HTML at the edge AND in the operator's browser,
# so a CSS-only fix can fail to reach operators for hours/days while
# they continue to load a stale HTML.  That is the root cause of the
# "composer still overlaps the thread even though main was fixed"
# report on 2026-05-09 (PRs #599 / #600 had shipped the CSS fix; the
# operator was still loading pre-#599 HTML+CSS).
#
# We treat HTML as never-cache and rely on URL-versioned JS (?v=…)
# for cache-busting on the heavy assets. The ?v= tokens are auto-
# rewritten by scripts/bust-cache.mjs in the build step above so
# every deploy uses a fresh, deploy-unique value (COMMIT_REF).

# Security headers — applied site-wide. Safe, non-breaking hardening
# headers (no enforcing CSP). They harden a PII-handling operator
# dashboard against clickjacking, MIME sniffing, referrer leakage, and
# protocol-downgrade attacks. geolocation=(self) because the routing
# app uses navigator.geolocation (dashboard/live.js, app/app.js).
# camera/microphone/display-capture=(self) because RouteReady Meet
# (dashboard/meet.html) is a first-party video tool — (self) still
# denies embedded third-party iframes; the browser's own permission
# prompt continues to gate actual device access per page.
# X-Frame-Options SAMEORIGIN (was DENY): the dashboard's interview room
# embeds our own meet.html in an iframe. SAMEORIGIN still blocks every
# cross-origin framing attempt (the clickjacking case DENY guarded).
# CSP: enforcing baseline (project-review PR#1) — script-src keeps
# 'unsafe-inline' (inline handlers everywhere; nonce refactor is its own
# project) but pins script ORIGIN to self + the three CDNs actually used.
# The origin-by-origin rationale is documented in _headers. KEEP THE CSP
# VALUE IDENTICAL to _headers — scripts/check-headers-parity.mjs fails
# `npm run smoke` when the two host configs drift.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy        = "geolocation=(self), camera=(self), microphone=(self), display-capture=(self), payment=()"
    X-XSS-Protection          = "0"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh https://unpkg.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://esm.sh https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://doiwrhkirgblcvuskhno.supabase.co; connect-src 'self' https://doiwrhkirgblcvuskhno.supabase.co wss://doiwrhkirgblcvuskhno.supabase.co https://*.livekit.cloud wss://*.livekit.cloud https://cdn.jsdelivr.net https://esm.sh https://unpkg.com https://docs.google.com https://*.googleusercontent.com https://api.weather.gov https://archive-api.open-meteo.com https://api.sunrise-sunset.org https://api.rainviewer.com https://vpic.nhtsa.dot.gov https://storage.googleapis.com https://tessdata.projectnaptha.com https://challenges.cloudflare.com; worker-src 'self' blob: https://cdn.jsdelivr.net; frame-src 'self' blob: https://challenges.cloudflare.com https://calendar.google.com https://doiwrhkirgblcvuskhno.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/dashboard/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

# Service workers must never be edge-cached — a stale SW pins users
# on the previous shell. Same rule as the HTML above: never-cache,
# rely on the browser's standard SW update check on every navigation.
# Manifest gets the same treatment so a manifest change (icons,
# shortcuts) reaches devices on the next load.
[[headers]]
  for = "/dashboard/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

[[headers]]
  for = "/dashboard/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type  = "application/manifest+json"

# Driver PWA SW + manifest follow the same rule so the two installs
# stay in lockstep on deploys.
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type  = "application/manifest+json"

# ── Immutable long-cache for ?v=-tokened assets (project-review PR#22) ──
# Every reference to these carries a deploy-unique ?v= token
# (bust-cache.mjs), so a deploy changes the URL and the year-long cache
# can never pin an operator on stale code. Previously these ~8 MB of
# JS/CSS were revalidated on every load. Deliberately EXCLUDED:
# /dashboard/sw.js + manifests (no-cache above), /dashboard/config.js +
# desktop-connect.js (referenced WITHOUT tokens from login.html), and
# /app/*.js (driver shell is service-worker-precached via bare URLs — an
# immutable HTTP cache would feed the SW stale bytes on SHELL_CACHE
# bumps). Keep this list in sync with _headers (parity-checked).

[[headers]]
  for = "/dashboard/views/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/dashboard/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

