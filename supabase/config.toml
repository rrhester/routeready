# RouteReady — Supabase project configuration

project_id = "doiwrhkirgblcvuskhno"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://gorouteready.com/dashboard/"
additional_redirect_urls = [
  "https://gorouteready.com/dashboard/",
  "https://gorouteready.com/dashboard/index.html",
  "https://gorouteready.com/dashboard/login.html",
  "http://localhost:3000",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Self-serve magic-link signup is open; the on_auth_user_created trigger
# (migration 0005) rejects emails outside ALLOWED_SIGNUP_DOMAINS.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = true
template = "Your RouteReady code is {{ .Code }}"

[auth.sms.twilio]
enabled = false
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Server-to-server functions called by pg_cron + triggers with the
# service role key in a bearer header. Gateway JWT verification is off
# (the new sb_secret_… keys are not JWTs and 401 at the gateway when
# verify_jwt = true); the functions themselves bearer-check via
# requireServiceKey() in supabase/functions/_shared/supabase.ts.
[functions.send-email]
verify_jwt = false

[functions.send-sms]
verify_jwt = false

# Inbound email webhook · Cloudflare Email Worker POSTs here with a
# raw EMAIL_INBOUND_SECRET bearer (not a JWT). Must stay verify_jwt
# off — otherwise the gateway 401s every Worker call before the
# function's own bearer check (index.ts:190) can run, and no inbound
# row lands. Without this entry, the CLI re-applies the project
# default (verify_jwt = true) on every CI deploy and silently breaks
# inbound mail.
[functions.webhook-email-inbound]
verify_jwt = false

# Repair Center shop portal — no-login access for repair shops via a
# hashed capability token (migration 0487). The token IS the auth; the
# repair_portal_* RPCs it calls are granted to service_role only.
[functions.repair-shop-portal]
verify_jwt = false

# Resend deliverability events (delivered / bounced / complained) —
# Svix-signed like webhook-email-inbound; the signature IS the auth,
# so gateway JWT verification must stay off (migration 0490).
[functions.webhook-email-events]
verify_jwt = false

# Repair Center estimate extraction. Called server-to-server by the
# inbound-email pipeline (service-role bearer) AND from the dashboard
# with a user JWT it validates in-function (RLS check) — gateway
# verify_jwt off so both paths and the browser CORS preflight work.
[functions.repair-quote-extract]
verify_jwt = false

# Workforce Optimization Engine functions. Both do their own JWT check
# internally (auth.getUser + app_users role gate); gateway verify_jwt
# must stay off so the browser CORS preflight gets a 2xx response. With
# verify_jwt = true the gateway 401s the OPTIONS request and the
# browser blocks the POST with a CORS error.
[functions.dispatch-optimization-run]
verify_jwt = false

[functions.explain-optimization-run]
verify_jwt = false

# Desktop app "Connect from browser" pairing. redeem is called by the app
# with only a pairing code (no user JWT), so gateway verify_jwt must be off;
# mint does its own auth check internally (auth.getUser on the caller's JWT).
[functions.desktop-pair]
verify_jwt = false

# Central Anthropic proxy for sync boxes. Gateway verify_jwt is off because we
# validate the box's DSP-session JWT in-function (auth.getUser) so we control
# the 401s + CORS; the function then injects RouteReady's ANTHROPIC_API_KEY.
[functions.ai-proxy]
verify_jwt = false

# Public health probe for an external uptime monitor. verify_jwt off so a
# monitor can hit it with no credentials; it returns only up/down + latency,
# never tenant data.
[functions.health]
verify_jwt = false

# Owner-only document-file export (data portability / DSR). verify_jwt off so
# the browser CORS preflight succeeds; the function validates the caller's JWT +
# requires role='owner' and scopes to their dsp_id in-code.
[functions.export-tenant-files]
verify_jwt = false

# Cal.com interview-availability editor. Reads/writes the operator's single
# shared Cal schedule via the server-side CAL_API_KEY. Gateway verify_jwt off
# so the browser CORS preflight gets a 2xx; the function validates the caller's
# JWT and requires a STAFF app_user (dispatcher/ops/owner) in-code. Was
# previously un-gated — any user (or anonymous caller) could rewrite the
# global interview availability.
[functions.cal-availability]
verify_jwt = false

# Authenticated applicant intake for sync boxes (uploads via the box's DSP
# session — no apply-secret/short-code on the box). verify_jwt off; the
# function validates the JWT + resolves the DSP server-side.
[functions.box-ingest]
verify_jwt = false

# DVIC AI photo-damage review. Invoked server-to-server via pg_net (the
# vehicle_inspections AFTER-INSERT trigger + the dashboard's
# vehicle_dvic_request_ai RPC), both presenting the service-role key as a
# bearer (migration 0242). Gateway verify_jwt off (the sb_secret_… key is
# not a JWT and 401s at the gateway); the function bearer-checks in-code via
# requireServiceKey(). Previously absent here (deployed by hand) and
# un-gated — an IDOR + Anthropic-key-drain surface.
[functions.dvic-ai-review]
verify_jwt = false

# Parts Intelligence VIN decode. Proxies the free public NHTSA vPIC API behind
# a strict VIN allowlist (SSRF-safe: fixed host, validated 17-char VIN only).
# Gateway verify_jwt off so the browser CORS preflight gets a 2xx; the function
# validates the caller's JWT (auth.getUser) in-code. Deploy with --no-verify-jwt.
[functions.vin-decode]
verify_jwt = false

# Live parts-supplier search proxy. Fans out to providers that have credentials
# configured (e.g. eBay Browse API via EBAY_CLIENT_ID/EBAY_CLIENT_SECRET edge
# secrets) — keys stay server-side, only fixed provider hosts are contacted.
# Gateway verify_jwt off so the browser CORS preflight gets a 2xx; the function
# validates the caller's JWT in-code. Deploy with --no-verify-jwt.
[functions.parts-search]
verify_jwt = false

[analytics]
enabled = false
