# RouteReady — Supabase project configuration

project_id = "doiwrhkirgblcvuskhno"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://gorouteready.com/dashboard/"
additional_redirect_urls = [
  "https://gorouteready.com/dashboard/",
  "https://gorouteready.com/dashboard/index.html",
  "https://gorouteready.com/dashboard/login.html",
  "http://localhost:3000",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Self-serve magic-link signup is open; the on_auth_user_created trigger
# (migration 0005) rejects emails outside ALLOWED_SIGNUP_DOMAINS.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = true
template = "Your RouteReady code is {{ .Code }}"

[auth.sms.twilio]
enabled = false
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Server-to-server functions called by pg_cron + triggers with the
# service role key in a bearer header. Gateway JWT verification is off
# (the new sb_secret_… keys are not JWTs and 401 at the gateway when
# verify_jwt = true); the functions themselves bearer-check via
# requireServiceKey() in supabase/functions/_shared/supabase.ts.
[functions.send-email]
verify_jwt = false

[functions.send-sms]
verify_jwt = false

# Inbound email webhook · Cloudflare Email Worker POSTs here with a
# raw EMAIL_INBOUND_SECRET bearer (not a JWT). Must stay verify_jwt
# off — otherwise the gateway 401s every Worker call before the
# function's own bearer check (index.ts:190) can run, and no inbound
# row lands. Without this entry, the CLI re-applies the project
# default (verify_jwt = true) on every CI deploy and silently breaks
# inbound mail.
[functions.webhook-email-inbound]
verify_jwt = false

# Workforce Optimization Engine functions. Both do their own JWT check
# internally (auth.getUser + app_users role gate); gateway verify_jwt
# must stay off so the browser CORS preflight gets a 2xx response. With
# verify_jwt = true the gateway 401s the OPTIONS request and the
# browser blocks the POST with a CORS error.
[functions.dispatch-optimization-run]
verify_jwt = false

[functions.explain-optimization-run]
verify_jwt = false

# Desktop app "Connect from browser" pairing. redeem is called by the app
# with only a pairing code (no user JWT), so gateway verify_jwt must be off;
# mint does its own auth check internally (auth.getUser on the caller's JWT).
[functions.desktop-pair]
verify_jwt = false

[analytics]
enabled = false
