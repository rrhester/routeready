# RouteReady — Supabase project configuration
# Generated for Phase 1 foundation. See supabase/PLAN.md for full architecture.
#
# A more complete config is auto-generated by `supabase init`. This file holds
# the bits we want under version control as part of Phase 1.

project_id = "routeready"

[api]
enabled = true
port = 54321
# Schemas exposed via PostgREST. Keep this tight — internal helpers live in `private`.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://gorouteready.com", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # New users invited only — no public signups for staff
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = true
template = "Your RouteReady code is {{ .Code }}"

[auth.sms.twilio]
enabled = false  # Toggle on once Twilio creds are loaded as secrets
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

# Custom Access Token hook — populates dsp_id / role / driver_id claims
# from public.app_users. Defined in migration 20260510020000_app_users.sql.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
