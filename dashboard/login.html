<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in · RouteReady</title>
<link rel="icon" href="data:," />
<style>
    @font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url(../app/fonts/inter-var-latin.woff2) format('woff2')}
  /* Unified light system (modernization pass 4) — same tokens as the
     dashboard: neutral #F7F8FA canvas, white card with hairline border
     + flat shadow, 8px card / 6px control radii, brand blue accent. */
  :root { --accent:#2563eb; --accent-hover:#1D4ED8; --bg:#F7F8FA; --card:#FFFFFF; --text:#0F172A; --muted:#475569; --border:rgba(15,23,42,.08); --border-strong:rgba(15,23,42,.16); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Inter",-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{min-height:100%;display:grid;place-items:center;padding:32px}
  .card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:32px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .brand-mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;margin-bottom:16px}
  h1{margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:-.01em}
  p{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.5}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
  input{width:100%;background:#fff;border:1px solid var(--border-strong);border-radius:6px;color:var(--text);padding:10px 12px;font:inherit;font-size:14px}
  input::placeholder{color:#94A3B8}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  button{width:100%;margin-top:18px;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:11px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .12s ease}
  button:hover{background:var(--accent-hover)}
  button[disabled]{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;line-height:1.5}
  .msg.ok{color:#15803D}
  .msg.err{color:#B91C1C}
  .footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand-mark" aria-hidden="true">R</div>
    <h1>RouteReady</h1>
    <p>Enter your work email and we'll send you a magic-link to sign in. Only addresses on allowed domains can sign in.</p>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@gorouteready.com" />
      <button type="submit" id="submit">Send magic link</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="footer">© RouteReady · <a href="/" style="color:var(--muted)">Back to home</a></div>
  </div>
</div>

<script src="./config.js"></script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
  const cfg = window.RR_CONFIG;
  const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  const params = new URLSearchParams(location.search);
  const next   = params.get("next") || "./index.html";
  const errCode = params.get("err");

  // Desktop "Connect from browser" pairing: the installed app calls this
  // (after redeeming a routeready:// code) to sign THIS window in. It reuses
  // this page's own `sb` client — no second Supabase instance (a duplicate
  // client previously broke sign-in).
  window.__rrApplySession = async (accessToken, refreshToken) => {
    try {
      const { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
      if (error) { console.warn("[rr-pair]", error.message); return false; }
      location.replace(next);
      return true;
    } catch (e) { console.warn("[rr-pair] threw", e); return false; }
  };

  const msg = document.getElementById("msg");
  if (errCode === "no_profile") {
    msg.className = "msg err";
    msg.textContent = "Your account isn't linked to a tenant yet. Contact your administrator.";
  } else if (errCode === "session_expired") {
    msg.className = "msg err";
    msg.textContent = "Your session expired. Sign in again to continue.";
  } else if (errCode === "dsp_unresolved") {
    msg.className = "msg err";
    msg.textContent = "We couldn't load your workspace. Sign in again — if it keeps happening, contact support.";
  } else if (errCode === "profile_load_failed") {
    msg.className = "msg err";
    msg.textContent = "We couldn't load your profile. Sign in again — if it keeps happening, contact support.";
  }

  // If already signed in, bounce to next.
  const { data: { session } } = await sb.auth.getSession();
  if (session) location.replace(next);

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const btn   = document.getElementById("submit");
    if (!email || !email.includes("@")) {
      msg.className = "msg err";
      msg.textContent = "Enter a valid email.";
      return;
    }
    // Domain allowlisting is now enforced server-side by the
    // on_auth_user_created trigger so dashboard-initiated invites
    // (which carry invite_dsp_id metadata) can land any email here
    // without tripping a page-level gate.
    btn.disabled = true;
    msg.className = "msg";
    msg.textContent = "Sending…";
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: location.origin + location.pathname.replace(/[^/]+$/, "") + "index.html" },
    });
    if (error) {
      btn.disabled = false;
      msg.className = "msg err";
      msg.textContent = error.message;
    } else {
      msg.className = "msg ok";
      msg.textContent = "Check your inbox for the sign-in link.";
    }
  });
</script>
</body>
</html>
