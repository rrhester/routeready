<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Schedule your interview</title>
<style>
    @font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url(../app/fonts/inter-var-latin.woff2) format('woff2')}
  :root{
    --accent:#2563EB; --accent-d:#1D4ED8; --text:#202124; --muted:#5F6368;
    --subtle:#80868B; --border:#DADCE0; --canvas:#fff; --surface:#fff; --red:#D93025; --green:#188038;
    --availbg:#E8F0FE;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 "Inter","Google Sans","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--canvas)}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 28px 72px}

  /* ── Host header (avatar + name on the left, title + meta on the right) ── */
  .host{display:flex;gap:34px;align-items:flex-start;margin-bottom:14px}
  .host-id{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:180px}
  .host-av{width:52px;height:52px;border-radius:50%;background:#5b4636;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:0 0 auto}
  .host-name{font-size:17px;font-weight:600}
  .host-main{flex:1 1 auto;min-width:0}
  .host-title{font-size:26px;font-weight:400;line-height:1.2;margin:0 0 16px}
  .host-mrow{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted);margin:0 0 12px}
  .host-mrow svg{color:var(--muted);flex:0 0 auto}

  hr.div{border:0;border-top:1px solid var(--border);margin:18px 0 0}

  /* ── Booking card ── */
  .bcard{padding:26px 4px 4px}
  .bcard-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 22px;flex-wrap:wrap}
  .bcard-h h2{font-size:21px;font-weight:400;margin:0}
  .tz{font-size:13px;color:var(--muted)}
  .bcard-body{display:flex;gap:40px;align-items:flex-start}

  /* mini month calendar */
  .mini{flex:0 0 252px;width:252px}
  .mini-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
  .mini-h .mlabel{font-size:14px;font-weight:600}
  .mini-nav{display:flex;gap:2px}
  .iconbtn{appearance:none;border:0;background:transparent;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:#F1F3F4}
  .iconbtn:disabled{opacity:.35;cursor:default;background:transparent}
  .mini-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
  .mini-dow span{text-align:center;font-size:11px;color:var(--subtle)}
  .mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .mini-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:50%;color:var(--text)}
  .mini-d.blank{visibility:hidden}
  .mini-d.muted{color:#C4C7C5}
  .mini-d.avail{background:var(--availbg);color:var(--accent-d);font-weight:600;cursor:pointer}
  .mini-d.avail:hover{background:#D2E3FC}
  .mini-d.today{outline:1px solid var(--accent)}
  .mini-d.sel{background:var(--accent);color:#fff}
  .mini-d.sel:hover{background:var(--accent-d)}

  /* day-column grid */
  .gridwrap{flex:1 1 auto;min-width:0;display:flex;align-items:stretch;gap:4px}
  .gridwrap .pager{flex:0 0 auto;align-self:flex-start;margin-top:2px}
  .strip{flex:1 1 auto;min-width:0;display:flex;gap:8px;overflow-x:auto}
  .col{flex:1 1 0;min-width:92px;display:flex;flex-direction:column;align-items:center}
  .col-h{text-align:center;margin-bottom:12px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px}
  .col-h .dow{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
  .col-h .dom{font-size:22px;font-weight:400;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .col-h.today .dom{background:var(--accent);color:#fff}
  .col-b{width:100%;display:flex;flex-direction:column;gap:10px}
  .gslot{appearance:none;cursor:pointer;font:inherit;font-weight:500;font-size:14px;color:var(--accent-d);
    background:#fff;border:1px solid #BBD3EA;border-radius:8px;padding:11px 6px;transition:.12s;width:100%;text-align:center}
  .gslot:hover{background:var(--availbg);border-color:var(--accent)}
  .gslot:disabled{opacity:.5;cursor:default}
  .gslot .spots{display:block;font-size:11px;font-weight:600;color:var(--green);margin-top:3px}
  .gnone{color:#C4C7C5;font-size:18px;text-align:center;padding:8px 0}

  /* states */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-top:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);max-width:560px}
  .msg{text-align:center;padding:36px 16px;color:var(--muted)}
  .msg strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
  .ok-ico{width:56px;height:56px;border-radius:50%;background:rgba(24,128,56,.12);color:var(--green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .err{color:var(--red)}
  .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:s .7s linear infinite;margin:24px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .foot{text-align:center;font-size:12px;color:var(--subtle);margin-top:32px}
  /* tz switch link */
  .tz{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tzswitch{appearance:none;border:0;background:transparent;color:var(--accent-d);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
  /* confirmation panel */
  .confirm{max-width:460px}
  .confirm .who{font-size:13px;color:var(--muted);margin:0 0 4px}
  .confirm .cw-when{font-size:20px;font-weight:600;margin:0 0 4px}
  .confirm .cw-sub{font-size:14px;color:var(--muted);margin:0 0 20px}
  .confirm .cw-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:0 0 10px}
  .confirm .cw-row svg{flex:0 0 auto;color:var(--muted)}
  .cbtns{display:flex;gap:10px;margin-top:22px}
  .btn{appearance:none;cursor:pointer;font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:12px 22px;border:1px solid var(--border);background:#fff;color:var(--text)}
  .btn:hover{background:#F1F3F4}
  .btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-p:hover{background:var(--accent-d)}
  .btn-p:disabled{opacity:.6;cursor:default}
  .addcal{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-weight:600;color:var(--accent-d);text-decoration:none}
  .addcal:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  /* Operator preview banner + note */
  .pv-banner{display:flex;align-items:center;gap:9px;background:#FEF7E0;border:1px solid #FCE8B2;color:#7A5B00;border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 4px}
  .pv-banner svg{flex:0 0 auto;color:#B7791F}
  .pv-note{background:var(--availbg);color:var(--accent-d);border:1px solid #c7dbff;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:14px}

  @media (max-width:860px){
    .wrap{padding:20px 16px 56px}
    .bcard-body{flex-direction:column;gap:20px}
    .mini{flex:0 0 auto;width:100%;max-width:320px;margin:0 auto}
    .gridwrap{width:100%}
  }
  @media (max-width:560px){
    .host{flex-direction:column;gap:14px}
    .host-id{min-width:0}
    .host-title{font-size:22px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="host">
      <div class="host-id">
        <div class="host-av" id="host-av">R</div>
        <div class="host-name" id="host-name">Interview</div>
      </div>
      <div class="host-main">
        <h1 class="host-title" id="host-title">Schedule your interview</h1>
        <div id="host-meta"></div>
      </div>
    </div>
    <div id="root"><div class="spin"></div></div>
    <div class="foot">Powered by RouteReady</div>
  </div>

<script src="/dashboard/config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const cfg = window.RR_CONFIG;
const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false } });

const root = document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

// Token from /b/<token> (200-rewrite keeps the path) or ?t=
const params = new URLSearchParams(location.search);
const pathMatch = location.pathname.match(/^\/b\/([^/?#]+)/);
const token = params.get("t") || params.get("token") || (pathMatch && pathMatch[1]) || "";

let TZ = "America/Chicago";      // the host/DSP timezone (slots are anchored here)
let DUR = 30;
let APPLICANT = "";               // whose link this is (shown so forwarded links are obvious)
// The viewer's own timezone, and the timezone times are currently displayed in.
// When the two differ we offer a one-click switch so a candidate in another
// zone never misreads "9:00am" (a common DSP-relocation failure mode).
const VIEWTZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (_) { return ""; } })();
let DISPTZ = "America/Chicago";
// Operator preview: /dashboard/booking.html?preview=<schedule_id> renders the
// page from a token-free booking_preview() call, with booking disabled.
const PREVIEW_ID = params.get("preview") || "";
const PREVIEW = !!PREVIEW_ID;
let PREVIEW_SLOTS = [];

// ── Date helpers ──────────────────────────────────────────────────────────
// A "day key" is the slot's calendar date in the host timezone (YYYY-MM-DD).
// Times are formatted from the real instant in TZ; day labels are formatted
// from the abstract key anchored at UTC midnight (timeZone:"UTC") so the
// weekday/day-number always match the key regardless of the viewer's locale.
const dayKey = (iso) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso));
const keyToUTC = (key) => new Date(key + "T00:00:00Z");
const addDays = (key, n) => { const d = keyToUTC(key); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dowShort = (key) => new Intl.DateTimeFormat(undefined, { timeZone: "UTC", weekday: "short" }).format(keyToUTC(key)).toUpperCase();
const domNum = (key) => String(keyToUTC(key).getUTCDate());
const firstOfMonth = (key) => key.slice(0, 8) + "01";
const monthLabel = (key) => new Intl.DateTimeFormat(undefined, { timeZone: "UTC", month: "long", year: "numeric" }).format(keyToUTC(key));

function fmtTime(iso) { return new Intl.DateTimeFormat(undefined, { timeZone: DISPTZ, hour: "numeric", minute: "2-digit" }).format(new Date(iso)).toLowerCase().replace(/\s/g, ""); }
function fmtDay(iso) { return new Intl.DateTimeFormat(undefined, { timeZone: DISPTZ, weekday: "long", month: "short", day: "numeric" }).format(new Date(iso)); }
function fmtRange(startIso, endIso) {
  const t1 = fmtTime(startIso);
  const t2 = endIso ? fmtTime(endIso) : "";
  return t2 ? `${t1} – ${t2}` : t1;
}
// Human copy for the RPC error codes candidates can actually hit, so they never
// see raw Postgres/PostgREST strings (those go to the console only).
function bookErrorCopy(raw) {
  const s = String(raw || "").toLowerCase();
  if (s.includes("slot_taken")) return "That time was just taken — please pick another.";
  if (s.includes("already_booked")) return "You already have an interview scheduled. Refresh this page to see it.";
  if (s.includes("not_eligible")) return "This scheduling link is no longer active. Please reply to the email or text we sent you.";
  if (s.includes("slot_too_soon")) return "That time is too soon to book — please choose a later one.";
  if (s.includes("slot_unavailable")) return "That time isn't available — please pick another.";
  if (s.includes("invalid_or_expired_token")) return "This scheduling link is no longer valid. Please reply to the email or text we sent you for a new one.";
  if (s.includes("failed to fetch") || s.includes("network")) return "Network hiccup — check your connection and try that time again.";
  return "Couldn't book that time — please pick another.";
}

function tzPretty(tz) {
  try {
    const now = new Date();
    const off = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "longOffset" }).formatToParts(now).find(p => p.type === "timeZoneName")?.value || "";
    const long = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "long" }).formatToParts(now).find(p => p.type === "timeZoneName")?.value || "";
    const city = String(tz).replace(/^[^/]+\//, "").replace(/_/g, " ");
    return `${off ? "(" + off + ") " : ""}${long}${city ? " · " + city : ""}`.trim();
  } catch (_) { return String(tz || "").replace(/^[^/]+\//, "").replace(/_/g, " "); }
}

// One-click "Add to Google Calendar" (TEMPLATE render URL). Works for the
// candidate without any backend.
function gcalUrl(startIso, endIso, meetingUrl, location) {
  const fmt = (iso) => new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const end = endIso || new Date(new Date(startIso).getTime() + DUR * 60000).toISOString();
  const details = meetingUrl && /^https:\/\//i.test(meetingUrl) ? ("Join the video meeting: " + meetingUrl) : "";
  const p = new URLSearchParams({
    action: "TEMPLATE", text: "Interview",
    dates: `${fmt(startIso)}/${fmt(end)}`, details, location: location || "",
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

// The timezone label doubles as a switch when the viewer isn't in the host tz.
function tzLabelHTML() {
  const canSwitch = VIEWTZ && VIEWTZ !== TZ;
  const other = DISPTZ === TZ ? VIEWTZ : TZ;
  const sw = canSwitch
    ? `<button type="button" class="tzswitch" data-tzswitch title="Show times in ${esc(tzPretty(other))}">Switch to ${esc(String(other).replace(/^[^/]+\//, "").replace(/_/g, " "))} time</button>`
    : "";
  return `${esc(tzPretty(DISPTZ))}${sw}`;
}

function showError(msg) {
  root.innerHTML = `<div class="card"><div class="msg"><strong>Something went wrong</strong><span class="err">${esc(msg)}</span></div></div>`;
}

// ── State ─────────────────────────────────────────────────────────────────
let BYDAY = new Map();   // dayKey -> [slot]
let AVAIL = new Set();   // dayKeys that have at least one open slot
let TODAY = null;        // today's calendar date in TZ
let MAXDAY = null;       // last day with availability
let viewStart = null;    // leftmost column of the 7-day strip
let selKey = null;       // currently highlighted day
let miniAnchor = null;   // first-of-month shown in the mini calendar

async function init() {
  if (!PREVIEW && !token) return showError("This scheduling link looks invalid. Please use the link we sent you.");
  let info;
  try {
    if (PREVIEW) {
      const { data, error } = await sb.rpc("booking_preview", { p_schedule_id: PREVIEW_ID });
      if (error) throw error;
      info = data;
      PREVIEW_SLOTS = (data && data.slots) || [];
    } else {
      const { data, error } = await sb.rpc("booking_load", { p_token: token });
      if (error) throw error;
      info = data;
    }
  } catch (e) {
    return showError((e && e.message) || "Could not load this scheduling link.");
  }
  TZ = info.timezone || TZ;
  DISPTZ = TZ;
  DUR = info.slot_minutes || DUR;
  APPLICANT = (info?.applicant?.first_name || info?.applicant?.full_name || "").trim();
  const dspName = info?.dsp?.name || "Driver Application";
  const schedName = (info.schedule_name || "").trim();
  document.getElementById("host-name").textContent = dspName;
  document.getElementById("host-av").textContent = (dspName[0] || "R").toUpperCase();
  document.getElementById("host-title").textContent = schedName || `${DUR}-minute interview`;

  const clockIco = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>`;
  const camIco = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M22 8l-5 4 5 4z"/></svg>`;
  document.getElementById("host-meta").innerHTML =
    `<div class="host-mrow">${clockIco}<span>${DUR} min appointments</span></div>
     <div class="host-mrow">${camIco}<span>Video conference details added after booking</span></div>`;

  if (!PREVIEW && info.already_booked) {
    const bk = info.booking || null;
    let detail = "Your interview is booked. Check your email for the details.";
    let extras = "";
    if (bk && bk.starts_at) {
      detail = `${esc(fmtDay(bk.starts_at))}<br>${esc(fmtRange(bk.starts_at, bk.ends_at))} · ${esc(tzPretty(DISPTZ))}`;
      if (bk.meeting_url && /^https:\/\//i.test(bk.meeting_url)) {
        extras += `<div style="margin-top:14px"><a class="addcal" href="${esc(bk.meeting_url)}" target="_blank" rel="noreferrer noopener">🎥 Join the video meeting</a></div>`;
      }
      extras += `<div style="margin-top:6px"><a class="addcal" href="${esc(gcalUrl(bk.starts_at, bk.ends_at, bk.meeting_url, bk.location))}" target="_blank" rel="noreferrer noopener">📅 Add to calendar</a></div>`;
    }
    root.innerHTML = `<div class="card"><div class="msg">
      <div class="ok-ico"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <strong>You're already scheduled</strong>
      <span>${detail}</span>${extras}
      <div class="cbtns" style="justify-content:center"><button class="btn" data-ab="reschedule">Reschedule</button><button class="btn" data-ab="cancel" style="color:var(--red);border-color:#E6C3C0">Cancel interview</button></div>
      <div id="ab-err" class="err" style="font-size:13px;margin-top:10px"></div></div></div>`;
    root.querySelector('[data-ab="reschedule"]').addEventListener("click", () => changeBooking("reschedule"));
    root.querySelector('[data-ab="cancel"]').addEventListener("click", () => changeBooking("cancel"));
    return;
  }

  const pvBanner = PREVIEW ? `<div class="pv-banner"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span><strong>Preview</strong> — this is what applicants see. Times aren't bookable here.</span></div>` : "";
  root.innerHTML = `${pvBanner}<hr class="div">
    <div class="bcard">
      <div class="bcard-h"><h2>Select an appointment time</h2><span class="tz" id="tz-label">${tzLabelHTML()}</span></div>
      <div id="cal-host"><div class="spin"></div></div>
    </div>`;
  wireTz();
  await loadAndRender();
}

// Bind the timezone switch (lives in the persistent header, so bound once and
// re-bound after each label refresh).
function wireTz() {
  const label = document.getElementById("tz-label");
  const btn = label && label.querySelector("[data-tzswitch]");
  if (btn) btn.addEventListener("click", () => {
    DISPTZ = DISPTZ === TZ ? VIEWTZ : TZ;
    label.innerHTML = tzLabelHTML();
    wireTz();
    if (document.querySelector(".confirm")) renderConfirm(); else renderBooking();
  });
}

// Cancel (and optionally re-book) the existing interview. Reschedule = cancel
// then re-enter the picker; the server frees the slot and lets them book again.
async function changeBooking(mode) {
  if (mode === "cancel" && !confirm("Cancel your interview? This frees your time slot.")) return;
  const errEl = document.getElementById("ab-err");
  document.querySelectorAll("[data-ab]").forEach(b => b.disabled = true);
  if (errEl) errEl.textContent = "";
  try {
    const { data, error } = await sb.rpc("cancel_interview_booking", { p_token: token });
    if (error) throw error;
    if (!data?.ok) throw new Error("Could not update your booking.");
    if (mode === "reschedule") {
      root.innerHTML = `<div class="spin"></div>`;
      await init();   // reloads booking_load (now unbooked) → shows the picker
    } else {
      root.innerHTML = `<div class="card"><div class="msg">
        <strong>Your interview is cancelled</strong>
        <span>If you'd like to book a new time, reply to the email or text we sent you.</span></div></div>`;
    }
  } catch (e) {
    console.warn("change booking failed:", e && (e.message || e));
    if (errEl) errEl.textContent = bookErrorCopy(e && e.message);
    document.querySelectorAll("[data-ab]").forEach(b => b.disabled = false);
  }
}

async function loadAndRender() {
  const host = document.getElementById("cal-host");
  let slots;
  if (PREVIEW) {
    slots = PREVIEW_SLOTS;
  } else {
    try {
      const { data, error } = await sb.rpc("interview_open_slots", { p_token: token });
      if (error) throw error;
      slots = data || [];
    } catch (e) {
      host.innerHTML = `<div class="err" style="font-size:13px">Couldn't load times: ${esc(e.message || e)}</div>`;
      return;
    }
  }
  BYDAY = new Map(); AVAIL = new Set();
  for (const s of slots) {
    const k = dayKey(s.slot_start);
    if (!BYDAY.has(k)) BYDAY.set(k, []);
    BYDAY.get(k).push(s);
    AVAIL.add(k);
  }
  TODAY = dayKey(new Date().toISOString());
  const availKeys = [...AVAIL].sort();
  if (!availKeys.length) {
    host.innerHTML = `<div class="msg"><strong>No open times right now</strong><span>Please check back soon, or reply to the email we sent.</span></div>`;
    return;
  }
  MAXDAY = availKeys[availKeys.length - 1];
  selKey = availKeys.find(k => k >= TODAY) || availKeys[0];
  // Start the strip on the first available day so applicants land on bookable
  // times immediately (rather than a run of empty leading days).
  viewStart = selKey;
  miniAnchor = firstOfMonth(selKey);
  renderBooking();
}

function renderBooking() {
  const host = document.getElementById("cal-host");
  host.innerHTML = `<div class="bcard-body">${miniHTML()}${gridHTML()}</div>`;
  wire(host);
}

// ── Mini month calendar ──
function miniHTML() {
  const firstKey = firstOfMonth(miniAnchor);
  const lead = keyToUTC(firstKey).getUTCDay();              // 0=Sun
  const days = new Date(Date.UTC(+firstKey.slice(0, 4), +firstKey.slice(5, 7), 0)).getUTCDate();
  const canPrev = firstKey > firstOfMonth(TODAY);
  const canNext = firstKey < firstOfMonth(MAXDAY);
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<span class="mini-d blank"></span>`;
  for (let d = 1; d <= days; d++) {
    const key = `${firstKey.slice(0, 7)}-${String(d).padStart(2, "0")}`;
    const cls = ["mini-d"];
    const isAvail = AVAIL.has(key);
    if (isAvail) cls.push("avail");
    else if (key < TODAY) cls.push("muted");
    if (key === TODAY) cls.push("today");
    if (key === selKey) cls.push("sel");
    cells += `<span class="${cls.join(" ")}"${isAvail ? ` data-mkey="${key}"` : ""}>${d}</span>`;
  }
  const chevL = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
  const chevR = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
  return `<div class="mini">
    <div class="mini-h">
      <span class="mlabel">${esc(monthLabel(firstKey))}</span>
      <span class="mini-nav">
        <button class="iconbtn" data-mnav="-1"${canPrev ? "" : " disabled"} aria-label="Previous month">${chevL}</button>
        <button class="iconbtn" data-mnav="1"${canNext ? "" : " disabled"} aria-label="Next month">${chevR}</button>
      </span>
    </div>
    <div class="mini-dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="mini-grid">${cells}</div>
  </div>`;
}

// ── 7-day slot grid ──
function gridHTML() {
  const cols = [];
  for (let i = 0; i < 7; i++) {
    const key = addDays(viewStart, i);
    const items = BYDAY.get(key) || [];
    let body;
    if (items.length) {
      body = items.map(s => {
        const group = (s.capacity || 1) > 1;
        const spots = group ? `<span class="spots">${esc(s.remaining)} left</span>` : "";
        return `<button class="gslot" data-start="${esc(s.slot_start)}" data-end="${esc(s.slot_end || "")}" data-session="${esc(s.session_id || "")}" aria-label="${esc(fmtTime(s.slot_start))}, ${esc(fmtDay(s.slot_start))}">${esc(fmtTime(s.slot_start))}${spots}</button>`;
      }).join("");
    } else {
      body = `<div class="gnone">—</div>`;
    }
    cols.push(`<div class="col">
      <div class="col-h${key === TODAY ? " today" : ""}"><span class="dow">${esc(dowShort(key))}</span><span class="dom">${esc(domNum(key))}</span></div>
      <div class="col-b">${body}</div>
    </div>`);
  }
  const chevL = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
  const chevR = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
  const canPrev = viewStart > TODAY;
  const canNext = addDays(viewStart, 6) < MAXDAY;
  return `<div class="gridwrap">
    <button class="iconbtn pager" data-gnav="-1"${canPrev ? "" : " disabled"} aria-label="Previous week">${chevL}</button>
    <div class="strip">${cols.join("")}</div>
    <button class="iconbtn pager" data-gnav="1"${canNext ? "" : " disabled"} aria-label="Next week">${chevR}</button>
  </div>`;
}

function wire(host) {
  host.querySelectorAll("[data-mnav]").forEach(b => b.addEventListener("click", () => {
    miniAnchor = firstOfMonth(addDays(firstOfMonth(miniAnchor), +b.getAttribute("data-mnav") > 0 ? 32 : -1));
    renderBooking();
  }));
  host.querySelectorAll("[data-mkey]").forEach(b => b.addEventListener("click", () => {
    selKey = b.getAttribute("data-mkey");
    viewStart = selKey;
    miniAnchor = firstOfMonth(selKey);
    renderBooking();
  }));
  host.querySelectorAll("[data-gnav]").forEach(b => b.addEventListener("click", () => {
    const dir = +b.getAttribute("data-gnav");
    let ns = addDays(viewStart, dir * 7);
    if (ns < TODAY) ns = TODAY;
    viewStart = ns;
    miniAnchor = firstOfMonth(viewStart);
    renderBooking();
  }));
  host.querySelectorAll(".gslot").forEach(b => b.addEventListener("click", () => selectSlot(b)));
}

let PENDING = null;   // slot awaiting confirmation: { start, end, session }

// Tapping a slot no longer books instantly (a mis-tap on a dense mobile grid
// used to create an irreversible booking). It opens a confirmation panel first.
function selectSlot(btn) {
  if (PREVIEW) {
    const host = document.getElementById("cal-host");
    let n = document.getElementById("pv-note");
    if (!n && host) { n = document.createElement("div"); n.id = "pv-note"; n.className = "pv-note"; host.prepend(n); }
    if (n) n.textContent = "Preview only — applicants pick a time from their own booking link.";
    return;
  }
  PENDING = {
    start: btn.getAttribute("data-start"),
    end: btn.getAttribute("data-end") || null,
    session: btn.getAttribute("data-session") || null,
  };
  renderConfirm();
}

function renderConfirm() {
  const host = document.getElementById("cal-host");
  if (!host || !PENDING) return;
  const clockIco = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>`;
  const tzIco = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M2 12h20M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>`;
  const who = APPLICANT ? `<div class="who">Booking as <strong>${esc(APPLICANT)}</strong> — if this isn't you, please use your own link.</div>` : "";
  host.innerHTML = `<div class="confirm">
    ${who}
    <div class="cw-when">${esc(fmtDay(PENDING.start))}</div>
    <div class="cw-sub">${esc(fmtRange(PENDING.start, PENDING.end))}</div>
    <div class="cw-row">${clockIco}<span>${DUR} minutes</span></div>
    <div class="cw-row">${tzIco}<span>${esc(tzPretty(DISPTZ))}</span></div>
    <div class="cbtns">
      <button class="btn" data-cx="back">Back</button>
      <button class="btn btn-p" data-cx="confirm">Confirm booking</button>
    </div>
    <div id="confirm-err" class="err" style="font-size:13px;margin-top:12px"></div>
  </div>`;
  host.querySelector('[data-cx="back"]').addEventListener("click", () => { PENDING = null; renderBooking(); });
  host.querySelector('[data-cx="confirm"]').addEventListener("click", () => doBook(host.querySelector('[data-cx="confirm"]')));
}

async function doBook(confirmBtn) {
  if (!PENDING) return;
  const { start, end, session } = PENDING;
  confirmBtn.disabled = true; confirmBtn.textContent = "Booking…";
  const errEl = document.getElementById("confirm-err");
  if (errEl) errEl.textContent = "";
  try {
    const { data, error } = await sb.rpc("book_interview_slot", { p_token: token, p_slot_start: start, p_session_id: session });
    if (error) throw error;
    if (!data?.ok) throw new Error("Could not book that time.");
    PENDING = null;
    const joinRow = "";  // meeting link is created a beat later; the email carries it
    root.innerHTML = `<div class="card"><div class="msg">
      <div class="ok-ico"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <strong>You're booked!</strong>
      <span>${esc(fmtDay(start))}<br>${esc(fmtRange(start, end))} · ${esc(tzPretty(DISPTZ))}<br>We'll email you the interview details.</span>
      <div style="margin-top:16px"><a class="addcal" href="${esc(gcalUrl(start, end, null, null))}" target="_blank" rel="noreferrer noopener">📅 Add to calendar</a></div>
      ${joinRow}</div></div>`;
  } catch (e) {
    console.warn("book failed:", e && (e.message || e));
    const msg = bookErrorCopy(e && e.message);
    // Terminal-ish errors (already booked / not eligible / expired): reload so
    // the page reflects reality. Slot conflicts: refresh the grid to pick again.
    const s = String((e && e.message) || "").toLowerCase();
    if (s.includes("already_booked") || s.includes("not_eligible") || s.includes("invalid_or_expired_token")) {
      PENDING = null;
      root.innerHTML = `<div class="card"><div class="msg"><strong>Heads up</strong><span>${esc(msg)}</span></div></div>`;
      return;
    }
    if (errEl) { errEl.textContent = msg; }
    confirmBtn.disabled = false; confirmBtn.textContent = "Confirm booking";
    // Refresh availability in the background so a re-pick reflects the truth.
    try {
      const { data } = await sb.rpc("interview_open_slots", { p_token: token });
      if (Array.isArray(data)) {
        BYDAY = new Map(); AVAIL = new Set();
        for (const sl of data) { const k = dayKey(sl.slot_start); if (!BYDAY.has(k)) BYDAY.set(k, []); BYDAY.get(k).push(sl); AVAIL.add(k); }
      }
    } catch (_) {}
  }
}

init();
</script>
