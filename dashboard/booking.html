<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>Schedule your interview</title>
<style>
    @font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url(../app/fonts/inter-var-latin.woff2) format('woff2')}
  :root{
    --accent:#2563EB; --accent-d:#0E5FA8; --text:#1B1B1F; --muted:#5A5A66;
    --subtle:#8A8A95; --border:#E4E4E9; --canvas:#F9FAFB; --surface:#fff; --red:#DC2626; --green:#16A34A;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--canvas)}
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 64px}
  .hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .logo{width:44px;height:44px;border-radius:8px;background:var(--accent);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto}
  .hdr-t{font-size:18px;font-weight:700;line-height:1.2}
  .hdr-s{font-size:13px;color:var(--muted);margin-top:2px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;margin-top:16px}
  .lead{font-size:16px;font-weight:600;margin:0 0 4px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
  .day{margin-top:18px}
  .day-h{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle);margin:0 0 8px}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .slot{appearance:none;cursor:pointer;font:inherit;font-weight:600;font-size:14px;color:var(--accent);
    background:#fff;border:1px solid #BBD3EA;border-radius:6px;padding:11px 8px;transition:.12s}
  .slot:hover{background:#F2F8FE;border-color:var(--accent)}
  .slot:disabled{opacity:.5;cursor:default}
  .slot .spots{display:block;font-size:11px;font-weight:600;color:var(--green);margin-top:3px}
  /* Date-first accordion: pick a date, its times drop down. */
  .acc{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .day-acc{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
  .day-acc.open{border-color:var(--accent);box-shadow:0 1px 3px rgba(37,99,235,.10)}
  .day-toggle{display:flex;align-items:center;gap:10px;width:100%;appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;padding:15px 16px;text-align:left}
  .day-toggle:hover{background:#F7FAFD}
  .day-name{font-size:15px;font-weight:600;color:var(--text);flex:1}
  .day-meta{font-size:12px;color:var(--subtle)}
  .day-chev{color:var(--subtle);transition:transform .15s;flex:0 0 auto}
  .day-acc.open .day-chev{transform:rotate(180deg)}
  .day-slots{padding:0 16px 16px}
  .msg{text-align:center;padding:36px 16px;color:var(--muted)}
  .msg strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
  .ok-ico{width:56px;height:56px;border-radius:50%;background:rgba(22,163,74,.12);color:var(--green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .err{color:var(--red)}
  .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:s .7s linear infinite;margin:24px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .btn{appearance:none;cursor:pointer;font:inherit;font-weight:600;font-size:14px;color:#fff;
    background:var(--accent);border:0;border-radius:6px;padding:11px 18px}
  .foot{text-align:center;font-size:12px;color:var(--subtle);margin-top:28px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div class="logo" id="logo">R</div>
      <div>
        <div class="hdr-t" id="dsp-name">Interview</div>
        <div class="hdr-s">Schedule your interview</div>
      </div>
    </div>
    <div id="root"><div class="spin"></div></div>
    <div class="foot">Powered by RouteReady</div>
  </div>

<script src="/dashboard/config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const cfg = window.RR_CONFIG;
const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false } });

const root = document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

// Token from /b/<token> (200-rewrite keeps the path) or ?t=
const params = new URLSearchParams(location.search);
const pathMatch = location.pathname.match(/^\/b\/([^/?#]+)/);
const token = params.get("t") || params.get("token") || (pathMatch && pathMatch[1]) || "";

let TZ = "America/Chicago";

function showError(msg) {
  root.innerHTML = `<div class="card"><div class="msg"><strong>Something went wrong</strong><span class="err">${esc(msg)}</span></div></div>`;
}
function fmtTime(iso) {
  return new Intl.DateTimeFormat(undefined, { timeZone: TZ, hour: "numeric", minute: "2-digit" }).format(new Date(iso));
}
function fmtDay(iso) {
  return new Intl.DateTimeFormat(undefined, { timeZone: TZ, weekday: "long", month: "short", day: "numeric" }).format(new Date(iso));
}

async function init() {
  if (!token) return showError("This scheduling link looks invalid. Please use the link we sent you.");
  let info;
  try {
    const { data, error } = await sb.rpc("booking_load", { p_token: token });
    if (error) throw error;
    info = data;
  } catch (e) {
    return showError((e && e.message) || "Could not load this scheduling link.");
  }
  TZ = info.timezone || TZ;
  const dspName = info?.dsp?.name || "Driver Application";
  document.getElementById("dsp-name").textContent = dspName;
  document.getElementById("logo").textContent = (dspName[0] || "R").toUpperCase();
  const first = info?.applicant?.first_name ? `, ${info.applicant.first_name}` : "";

  if (info.already_booked) {
    root.innerHTML = `<div class="card"><div class="msg">
      <div class="ok-ico"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <strong>You're already scheduled</strong>
      <span>Your interview is booked. Check your email for the details.</span></div></div>`;
    return;
  }

  root.innerHTML = `<div class="card">
    <p class="lead">Pick a date${esc(first)}</p>
    <p class="sub">Choose a day, then a time that works for you. Times shown in ${esc(TZ.replace("_"," "))}.</p>
    <div id="slots-host"><div class="spin"></div></div></div>`;
  await renderSlots();
}

async function renderSlots() {
  const host = document.getElementById("slots-host");
  let slots;
  try {
    const { data, error } = await sb.rpc("interview_open_slots", { p_token: token });
    if (error) throw error;
    slots = data || [];
  } catch (e) {
    host.innerHTML = `<div class="err" style="font-size:13px">Couldn't load times: ${esc(e.message || e)}</div>`;
    return;
  }
  if (!slots.length) {
    host.innerHTML = `<div class="msg"><strong>No open times right now</strong><span>Please check back soon, or reply to the email we sent.</span></div>`;
    return;
  }
  // Group by day → one collapsible row per date; times drop down on click.
  const byDay = new Map();
  for (const s of slots) {
    const key = fmtDay(s.slot_start);
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(s);
  }
  let html = `<div class="acc">`;
  for (const [day, items] of byDay) {
    let slotsHtml = "";
    for (const s of items) {
      const group = (s.capacity || 1) > 1;
      const spots = group ? `<span class="spots">${esc(s.remaining)} spot${s.remaining === 1 ? "" : "s"} left</span>` : "";
      slotsHtml += `<button class="slot" data-start="${esc(s.slot_start)}" data-session="${esc(s.session_id || "")}">${esc(fmtTime(s.slot_start))}${spots}</button>`;
    }
    html += `<div class="day-acc">
      <button class="day-toggle" type="button" aria-expanded="false">
        <span class="day-name">${esc(day)}</span>
        <span class="day-meta">${items.length} time${items.length === 1 ? "" : "s"}</span>
        <svg class="day-chev" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 6 8 10 12 6"/></svg>
      </button>
      <div class="day-slots" hidden><div class="slots">${slotsHtml}</div></div>
    </div>`;
  }
  html += `</div>`;
  host.innerHTML = html;
  // Accordion: open one date at a time; its times drop down below it.
  host.querySelectorAll(".day-toggle").forEach((t) => t.addEventListener("click", () => {
    const acc = t.closest(".day-acc");
    const isOpen = acc.classList.contains("open");
    host.querySelectorAll(".day-acc.open").forEach((a) => {
      a.classList.remove("open");
      a.querySelector(".day-slots").hidden = true;
      a.querySelector(".day-toggle").setAttribute("aria-expanded", "false");
    });
    if (!isOpen) {
      acc.classList.add("open");
      acc.querySelector(".day-slots").hidden = false;
      t.setAttribute("aria-expanded", "true");
    }
  }));
  host.querySelectorAll(".slot").forEach((b) => b.addEventListener("click", () => book(b)));
}

async function book(btn) {
  const start = btn.getAttribute("data-start");
  const session = btn.getAttribute("data-session") || null;
  document.querySelectorAll(".slot").forEach((b) => (b.disabled = true));
  btn.textContent = "Booking…";
  try {
    const { data, error } = await sb.rpc("book_interview_slot", { p_token: token, p_slot_start: start, p_session_id: session });
    if (error) throw error;
    if (!data?.ok) throw new Error("Could not book that time.");
    root.innerHTML = `<div class="card"><div class="msg">
      <div class="ok-ico"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <strong>You're booked!</strong>
      <span>${esc(fmtDay(start))} at ${esc(fmtTime(start))}<br>We'll email you the interview details${"" /* video link in Phase 3 */}.</span></div></div>`;
  } catch (e) {
    const m = (e.message || "").includes("slot_taken")
      ? "That time was just taken — pick another."
      : "Couldn't book that time — pick another.";
    const host = document.getElementById("slots-host");
    if (host) { host.innerHTML = `<div class="spin"></div>`; await renderSlots(); }
    const note = document.createElement("div");
    note.className = "err"; note.style.cssText = "font-size:13px;margin-top:10px";
    note.textContent = m;
    document.getElementById("slots-host")?.prepend(note);
  }
}

init();
</script>
</body>
</html>
