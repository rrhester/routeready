<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Screening · RouteReady</title>
<link rel="icon" href="data:," />
<style>
  :root { --accent:#2563eb; --bg:#0b0e14; --card:#11151d; --text:#e6e9ef; --muted:#8b94a7; --border:#1f2531; --ok:#3ddc97; --err:#ff6b6b; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}
  .q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .prompt{font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.4}
  .req{color:var(--err);margin-left:4px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
  .opt.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  input.txt{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font:inherit;font-size:14px}
  button.submit{margin-top:8px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  button[disabled]{opacity:.5;cursor:not-allowed}
  .done{padding:32px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:12px}
  .done h2{margin:0 0 8px;font-size:18px}
  .err{color:var(--err);margin-top:14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div id="root">Loading…</div>
</div>

<script src="./config.js"></script>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";
  const cfg = window.RR_CONFIG;
  const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  const root = document.getElementById("root");

  const token = new URLSearchParams(location.search).get("t");
  if (!token) {
    root.innerHTML = `<div class="done"><h2>Missing link</h2><p class="sub">This screening link looks invalid. Please use the link we texted you.</p></div>`;
    throw new Error("no token");
  }

  const { data, error } = await sb.rpc("screening_load", { p_token: token });
  if (error || !data) {
    root.innerHTML = `<div class="done"><h2>Link expired</h2><p class="sub">${error?.message ?? "This screening link is no longer valid."}</p></div>`;
    throw error ?? new Error("invalid");
  }

  const answers = {};
  function render() {
    const first = data.applicant.first_name || data.applicant.full_name || "there";
    const qs = data.questions.map((q) => {
      let body = "";
      if (q.field_type === "yes_no" || q.field_type === "single") {
        body = `<div class="opts">${(q.options ?? []).map(o => `
          <button type="button" class="opt ${answers[q.id] === o ? "sel" : ""}" data-q="${q.id}" data-v="${encodeURIComponent(o)}">${o}</button>
        `).join("")}</div>`;
      } else if (q.field_type === "number") {
        body = `<input class="txt" type="number" inputmode="numeric" data-q="${q.id}" value="${answers[q.id] ?? ""}" />`;
      } else {
        body = `<input class="txt" type="text" data-q="${q.id}" value="${answers[q.id] ?? ""}" />`;
      }
      return `<div class="q"><div class="prompt">${q.prompt}${q.required ? '<span class="req">*</span>' : ""}</div>${body}</div>`;
    }).join("");
    root.innerHTML = `
      <h1>Hi ${first} 👋</h1>
      <p class="sub">A few quick questions — takes about 2 minutes.</p>
      ${qs}
      <button type="button" class="submit" id="submit">Submit screening</button>
      <div class="err" id="err"></div>`;
  }
  render();

  root.addEventListener("click", (e) => {
    const o = e.target.closest(".opt");
    if (o) { answers[o.dataset.q] = decodeURIComponent(o.dataset.v); render(); }
  });
  root.addEventListener("input", (e) => {
    const q = e.target.dataset?.q;
    if (q) answers[q] = e.target.value;
  });
  root.addEventListener("click", async (e) => {
    if (e.target.id !== "submit") return;
    const errEl = document.getElementById("err");
    errEl.textContent = "";
    const required = data.questions.filter(q => q.required);
    const missing  = required.filter(q => !answers[q.id]);
    if (missing.length) { errEl.textContent = `Please answer all required questions (${missing.length} remaining).`; return; }
    e.target.disabled = true;
    e.target.textContent = "Submitting…";
    const payload = data.questions
      .filter(q => answers[q.id] != null)
      .map(q => ({ question_id: q.id, answer_text: String(answers[q.id]) }));
    const { error } = await sb.rpc("screening_submit", { p_token: token, p_answers: payload });
    if (error) {
      e.target.disabled = false;
      e.target.textContent = "Submit screening";
      errEl.textContent = error.message;
      return;
    }
    root.innerHTML = `<div class="done"><h2>Thanks!</h2><p class="sub">We've got your responses. If you're a fit, you'll get a text from us with next steps soon.</p></div>`;
  });
</script>
</body>
</html>
