<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Respond to your invitation</title>
<style>
    @font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url(../app/fonts/inter-var-latin.woff2) format('woff2')}
  :root{
    --accent:#2563EB; --accent-d:#1D4ED8; --text:#111827; --muted:#6B7280;
    --subtle:#8A8A95; --border:#E4E4E9; --canvas:#F9FAFB; --surface:#fff; --red:#DC2626; --green:#16A34A;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--canvas)}
  .wrap{max-width:520px;margin:0 auto;padding:28px 18px 64px}
  .hdr{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo{width:44px;height:44px;border-radius:8px;background:var(--accent);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto}
  .hdr-t{font-size:18px;font-weight:700;line-height:1.2}
  .hdr-s{font-size:13px;color:var(--muted);margin-top:2px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:18px}
  .title{font-size:19px;font-weight:700;margin:0 0 10px}
  .when{font-size:15px;margin:0 0 4px}
  .when b{font-weight:700}
  .tz{font-size:12px;color:var(--subtle);margin:2px 0 0}
  .join{display:inline-block;margin-top:12px;color:var(--accent);font-weight:600;text-decoration:none;word-break:break-all}
  .row{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;appearance:none;cursor:pointer;font:inherit;font-weight:700;font-size:15px;
    border-radius:8px;padding:13px 10px;border:1px solid;transition:.12s}
  .btn.accept{background:var(--green);border-color:var(--green);color:#fff}
  .btn.accept:hover{filter:brightness(.95)}
  .btn.decline{background:#fff;border-color:#D9C0BE;color:var(--red)}
  .btn.decline:hover{background:#FCF2F1}
  .btn[disabled]{opacity:.55;cursor:default}
  .result{text-align:center;padding:18px 6px}
  .ico{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .ico.ok{background:rgba(22,163,74,.12);color:var(--green)}
  .ico.no{background:rgba(196,40,28,.10);color:var(--red)}
  .result strong{display:block;font-size:18px;margin-bottom:6px}
  .result span{color:var(--muted)}
  .msg{text-align:center;padding:36px 16px;color:var(--muted)}
  .msg strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
  .err{color:var(--red)}
  .inlineerr{color:var(--red);font-size:13px;text-align:center;margin-top:12px}
  .btn.sel{outline:3px solid rgba(37,99,235,.35);outline-offset:1px}
  .changelink{display:inline-block;margin-top:14px;background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline}
  .confirmhint{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
  .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:s .7s linear infinite;margin:30px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .foot{text-align:center;font-size:12px;color:var(--subtle);margin-top:22px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div class="logo" id="logo">R</div>
      <div>
        <div class="hdr-t" id="hdr-t">RouteReady</div>
        <div class="hdr-s">Interview invitation</div>
      </div>
    </div>
    <div id="root"><div class="spin"></div></div>
    <div class="foot">Powered by RouteReady</div>
  </div>

<script src="/dashboard/config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const cfg = window.RR_CONFIG;
const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false } });

const root = document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

const params = new URLSearchParams(location.search);
const pathMatch = location.pathname.match(/^\/rsvp\/([^/?#]+)/);
const token = params.get("t") || params.get("token") || (pathMatch && pathMatch[1]) || "";
const preset = (params.get("r") || "").toLowerCase(); // optional ?r=accept|decline

function tzPretty(tz) {
  try {
    const long = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "long" }).formatToParts(new Date()).find(p => p.type === "timeZoneName")?.value || "";
    const city = String(tz).replace(/^[^/]+\//, "").replace(/_/g, " ");
    return long ? `${long}${city ? " · " + city : ""}` : city;
  } catch (_) { return String(tz || "").replace(/^[^/]+\//, "").replace(/_/g, " "); }
}
// Only render https meeting links as clickable — a stored javascript:/data: URL
// must never become an href a candidate can click.
const safeUrl = (u) => (/^https:\/\//i.test(String(u || "")) ? String(u) : "");

function fmtWhen(ev) {
  const tz = ev.timezone || "America/Chicago";
  const s = new Date(ev.starts_at);
  const date = new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday:"long", month:"long", day:"numeric", year:"numeric" }).format(s);
  const t = (d) => new Intl.DateTimeFormat("en-US", { timeZone: tz, hour:"numeric", minute:"2-digit" }).format(d);
  const time = t(s) + (ev.ends_at ? " – " + t(new Date(ev.ends_at)) : "");
  return { date, time, tz };
}
const isPast = (ev) => { try { return new Date(ev.ends_at || ev.starts_at).getTime() < Date.now(); } catch (_) { return false; } }
const isLive = (ev) => ev.status === "scheduled" || ev.status === "rescheduled";

function showError(msg) {
  root.innerHTML = `<div class="card"><div class="msg"><strong>This invitation link looks invalid</strong><span class="err">${esc(msg)}</span></div></div>`;
}
// A terminal, non-actionable state (cancelled / passed) — no live buttons.
function showState(strong, span, kind) {
  const ico = kind === "ok"
    ? `<div class="ico ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>`
    : `<div class="ico no"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>`;
  root.innerHTML = `<div class="card"><div class="result">${ico}<strong>${esc(strong)}</strong><span>${span}</span></div></div>`;
}

function renderEvent(ev) {
  if (ev.dsp_name) { document.getElementById("hdr-t").textContent = ev.dsp_name; document.getElementById("logo").textContent = (ev.dsp_name[0] || "R").toUpperCase(); }
  const { date, time, tz } = fmtWhen(ev);

  // Cancelled / removed event: never show working Accept/Decline (they'd no-op).
  if (!isLive(ev)) {
    showState("This event is no longer active",
      "This invitation was cancelled or is no longer available. If you think this is a mistake, reply to the email or text we sent you.", "no");
    return;
  }
  // Past event.
  if (isPast(ev)) {
    showState("This invitation has passed", `${esc(ev.title || "Your interview")} was scheduled for ${esc(date)}.`, "no");
    return;
  }

  const join = (ev.rsvp === "accepted" && safeUrl(ev.meeting_url))
    ? `<a class="join" href="${esc(safeUrl(ev.meeting_url))}" target="_blank" rel="noreferrer noopener">Join the video meeting →</a>` : "";
  const changeLink = `<button class="changelink" data-change>Change my response</button>`;

  if (ev.rsvp === "accepted") {
    root.innerHTML = `<div class="card"><div class="result">
      <div class="ico ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <strong>You're confirmed</strong><span>${esc(ev.title || "Your interview")}</span>
      <div class="when" style="margin-top:12px"><b>${esc(date)}</b></div><div class="when">${esc(time)}</div><div class="tz">${esc(tzPretty(tz))}</div>
      ${join}
      <div>${changeLink}</div>
    </div></div>`;
    root.querySelector("[data-change]")?.addEventListener("click", () => renderPending(ev, "decline"));
    return;
  }
  if (ev.rsvp === "declined") {
    root.innerHTML = `<div class="card"><div class="result">
      <div class="ico no"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      <strong>You've declined</strong><span>We've let the team know.</span>
      <div>${changeLink}</div>
    </div></div>`;
    root.querySelector("[data-change]")?.addEventListener("click", () => renderPending(ev, "accept"));
    return;
  }
  renderPending(ev, preset === "accept" || preset === "decline" ? preset : null);
}

// pending → details + Accept / Decline. `presel` pre-highlights a choice (from
// the email's ?r= link or a "change response" click) but ALWAYS requires an
// on-page click to record it — so mail-scanner prefetches and mis-taps can't
// silently RSVP.
function renderPending(ev, presel) {
  const { date, time, tz } = fmtWhen(ev);
  const hint = presel ? `<div class="confirmhint">Tap <b>${presel === "accept" ? "Accept" : "Decline"}</b> to confirm your response.</div>` : "";
  root.innerHTML = `<div class="card">
    <h1 class="title">${esc(ev.title || "You're invited")}</h1>
    <div class="when"><b>${esc(date)}</b></div>
    <div class="when">${esc(time)}</div>
    <div class="tz">${esc(tzPretty(tz))}</div>
    <div class="row">
      <button class="btn accept${presel === "accept" ? " sel" : ""}" data-r="accept">Accept</button>
      <button class="btn decline${presel === "decline" ? " sel" : ""}" data-r="decline">Decline</button>
    </div>
    ${hint}
    <div id="rsvp-err" class="inlineerr"></div>
  </div>`;
  root.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => respond(b.getAttribute("data-r"))));
}

async function respond(resp) {
  const btns = root.querySelectorAll("[data-r]");
  btns.forEach(b => b.disabled = true);
  const errEl = document.getElementById("rsvp-err");
  if (errEl) errEl.textContent = "";
  try {
    const { data, error } = await sb.rpc("rsvp_respond", { p_token: token, p_response: resp });
    if (error) throw error;
    if (!data || data.ok === false) { showError((data && data.error) || "not found"); return; }
    renderEvent(data);
  } catch (e) {
    // A transient network error must NOT brick the page or claim the link is
    // invalid — keep the buttons and show an inline, retryable message.
    console.warn("rsvp failed:", e && (e.message || e));
    if (errEl) errEl.textContent = "Couldn't save your response — check your connection and try again.";
    btns.forEach(b => b.disabled = false);
  }
}

async function load() {
  if (!token) { showError("missing token"); return; }
  try {
    // Always LOAD read-only (p_response omitted). The email's ?r= preset is
    // applied as a pre-highlight in renderPending and only recorded on an
    // explicit tap — closing the mail-scanner auto-RSVP hole.
    const { data, error } = await sb.rpc("rsvp_respond", { p_token: token });
    if (error) throw error;
    if (!data || data.ok === false) { showError((data && data.error) || "not found"); return; }
    renderEvent(data);
  } catch (e) { showError(e.message || String(e)); }
}
load();
</script>
</body>
</html>
