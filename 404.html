<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#2563EB" />
<meta name="robots" content="noindex" />
<title>Page not found · RouteReady</title>
<link rel="icon" href="data:," />
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url(/app/fonts/inter-var-latin.woff2) format('woff2')}
  /* Same light system tokens as login.html / the dashboard. */
  :root { --accent:#2563eb; --accent-hover:#1D4ED8; --bg:#F9FAFB; --card:#FFFFFF; --text:#0F172A; --muted:#475569; --border:rgba(15,23,42,.08); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Inter",-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{min-height:100%;display:grid;place-items:center;padding:32px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:32px;box-shadow:0 1px 2px rgba(15,23,42,.05);text-align:center}
  .brand-mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;margin-bottom:16px}
  .code{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  h1{margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:-.01em}
  p{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.5}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:11px 18px;font-size:14px;font-weight:600;text-decoration:none;transition:background .12s ease}
  a.btn:hover{background:var(--accent-hover)}
  a.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--border)}
  a.btn.secondary:hover{background:rgba(37,99,235,.06)}
  .footer{margin-top:24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand-mark" aria-hidden="true">R</div>
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on route.</p>
    <div class="actions">
      <a class="btn" href="/dashboard/">Open dashboard</a>
      <a class="btn secondary" href="/dashboard/login.html">Sign in</a>
    </div>
    <div class="footer">© RouteReady</div>
  </div>
</div>
</body>
</html>
