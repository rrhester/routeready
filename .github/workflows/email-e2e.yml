name: email-e2e

# Email (Fleet Bridge) e2e (tests/email-e2e, Email review EM#100) —
# drives the real dashboard against a stubbed Supabase. Guards the lazy
# module boot + nav unread dot, in-place read-state patching, search
# operators/scopes, and the composer draft-autosave chip-snap
# regression (operator-reported). Mirrors login-e2e.yml.
on:
  pull_request:
    paths:
      - "dashboard/live.js"
      - "dashboard/views/view-email.frag"
      - "dashboard/email-core.mjs"
      - "tests/email-e2e/**"
      - ".github/workflows/email-e2e.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/live.js"
      - "dashboard/views/view-email.frag"
      - "dashboard/email-core.mjs"
      - "tests/email-e2e/**"
  schedule:
    - cron: '37 9 * * 1'

env:
  PLAYWRIGHT_VERSION: 1.61.1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test deps
        run: npm install --no-save @playwright/test@$PLAYWRIGHT_VERSION http-server
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run email e2e
        run: npx playwright test --config tests/email-e2e/playwright.config.mjs
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: email-e2e-results
          path: test-results/
          retention-days: 14
