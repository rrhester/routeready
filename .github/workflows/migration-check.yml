name: Migration check (apply from scratch)

# ─────────────────────────────────────────────────────────────────────────
# Launch-readiness P0-1 safety gate.
#
# The single production Supabase project auto-deploys migrations on every
# merge to main (deploy-migrations.yml), with no pre-merge validation and no
# staging. One bad migration therefore hits every customer at once. This
# check closes that gap: on every PR that touches a migration, it boots a
# THROWAWAY local Supabase (Postgres + the auth / storage / extensions the
# migrations depend on) and applies the ENTIRE migration set from zero.
#
# It applies migrations exactly the way production does — via psql, in
# filename order, tracked by full filename — NOT via the Supabase CLI's own
# `schema_migrations` ledger. That matters because the CLI keys its ledger on
# the numeric prefix and would choke on the intentional duplicate ordinals
# (0264 / 0421 / 0432), whereas prod's apply-migrations.sh keys on the full
# filename and applies them fine. So this gate mirrors real prod behaviour.
#
# A green run proves every migration is valid SQL, applies in order with no
# dependency breakage, and that the database can be rebuilt from migrations
# alone — i.e. disaster recovery actually works.
#
# Hermetic: no project refs, DB passwords, or secrets. It only ever talks to
# the ephemeral local stack, never production.
# ─────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/driver-forms/**'
      - '.github/workflows/migration-check.yml'
  workflow_dispatch:

concurrency:
  group: migration-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-from-scratch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Boot a clean local Supabase (no repo migrations)
        # Stash the repo migrations so `db start` brings up a pristine Supabase
        # (auth + storage schemas, pg_cron / pg_net preloaded) WITHOUT applying
        # them itself — its ledger keys on the numeric prefix and would fail on
        # our duplicate ordinals. We apply them ourselves in the next step,
        # tracked by filename exactly like the production runner.
        run: |
          mkdir -p /tmp/rr-migrations
          mv supabase/migrations/*.sql /tmp/rr-migrations/
          supabase db start
          mv /tmp/rr-migrations/*.sql supabase/migrations/

      - name: Apply every migration from zero (fail on first error)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "▶ $(basename "$f")"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "✓ all migrations applied cleanly from scratch"

      - name: Driver-forms server tests (RPC gate / dedupe / validation parity)
        # The whole schema is now live in the throwaway DB, so exercise the
        # real driver_submit_form RPC and the 0436/0439 helpers against it:
        # assignment gate, once-per-driver dedupe, and field-validation parity
        # with the shared fixtures the JS validator is also checked against
        # (tests/driver-forms/validation-cases.json). Run from the repo root so
        # the suite's `\set … cat tests/driver-forms/...` resolves.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/driver_forms_test.sql

      - name: Tear down
        if: always()
        run: supabase stop --no-backup || true
