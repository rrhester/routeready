name: Migration check (apply from scratch)

# ─────────────────────────────────────────────────────────────────────────
# Launch-readiness P0-1 safety gate.
#
# The single production Supabase project auto-deploys migrations on every
# merge to main (deploy-migrations.yml), with no pre-merge validation and no
# staging. One bad migration therefore hits every customer at once. This
# check closes that gap: on every PR that touches a migration, it boots a
# THROWAWAY local Supabase (Postgres + the auth / storage / extensions the
# migrations depend on) and applies the ENTIRE migration set from zero.
#
# It applies migrations exactly the way production does — via psql, in
# filename order, tracked by full filename — NOT via the Supabase CLI's own
# `schema_migrations` ledger. That matters because the CLI keys its ledger on
# the numeric prefix and would choke on the intentional duplicate ordinals
# (0264 / 0421 / 0432), whereas prod's apply-migrations.sh keys on the full
# filename and applies them fine. So this gate mirrors real prod behaviour.
#
# A green run proves every migration is valid SQL, applies in order with no
# dependency breakage, and that the database can be rebuilt from migrations
# alone — i.e. disaster recovery actually works.
#
# Hermetic: no project refs, DB passwords, or secrets. It only ever talks to
# the ephemeral local stack, never production.
# ─────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/driver-forms/**'
      - 'supabase/seeds/**'
      - 'scripts/check-migration-ordinals.mjs'
      - '.github/workflows/migration-check.yml'
  # Weekly drift run: the toolchain floats (CLI releases, base images) and
  # this workflow doubles as the disaster-recovery rehearsal, so run it on
  # a schedule too — environment breakage then surfaces on a quiet Monday
  # instead of inside someone's unrelated PR.
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

concurrency:
  group: migration-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-from-scratch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: No new duplicate migration ordinals
        # The 31 historical collisions are grandfathered; any NEW one is
        # ambiguous for the operator's by-hand apply workflow (the likely
        # cause of the known 0432 skip). See the script header.
        run: node scripts/check-migration-ordinals.mjs

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (was `latest`) so a CLI release can't flip this gate red
          # under an unrelated PR; the weekly scheduled run is where drift
          # is allowed to surface. Bump deliberately.
          version: 2.109.1

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Boot a clean local Supabase (no repo migrations)
        # Stash the repo migrations so `db start` brings up a pristine Supabase
        # (auth + storage schemas, pg_cron / pg_net preloaded) WITHOUT applying
        # them itself — its ledger keys on the numeric prefix and would fail on
        # our duplicate ordinals. We apply them ourselves in the next step,
        # tracked by filename exactly like the production runner.
        run: |
          mkdir -p /tmp/rr-migrations
          mv supabase/migrations/*.sql /tmp/rr-migrations/
          supabase db start
          mv /tmp/rr-migrations/*.sql supabase/migrations/

      - name: Apply every migration from zero (fail on first error)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "▶ $(basename "$f")"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "✓ all migrations applied cleanly from scratch"

      - name: Driver-forms server tests (RPC gate / dedupe / validation parity)
        # The whole schema is now live in the throwaway DB, so exercise the
        # real driver_submit_form RPC and the 0436/0439 helpers against it:
        # assignment gate, once-per-driver dedupe, and field-validation parity
        # with the shared fixtures the JS validator is also checked against
        # (tests/driver-forms/validation-cases.json). Run from the repo root so
        # the suite's `\set … cat tests/driver-forms/...` resolves.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/driver_forms_test.sql

      - name: Schedule-concurrency server tests (optimistic assign_shift + realtime publication)
        # Exercises migration 0446 against the fully-migrated throwaway DB:
        # legacy assigns, stale-expectation refusal (shift_conflict + DETAIL,
        # row untouched), matching-expectation reassign, expected-null on an
        # open shift, shift_not_found, and supabase_realtime membership for
        # shifts / shift_offers / driver_checkins.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/schedule_concurrency_test.sql

      - name: Role-gate RLS tests (0452 · hiring_targets + route_forecasts)
        # Drops to the real `authenticated` role and asserts a role='driver'
        # app_user cannot INSERT hiring_targets / route_forecasts while a
        # 'dispatcher' can — i.e. the 0452 intra-tenant write gates actually
        # enforce, not just apply.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/role_gate_planning_test.sql

      - name: Role-gate RLS + RPC tests (0453 · compliance_dismissals)
        # Asserts a role='driver' app_user can neither INSERT compliance_dismissals
        # directly (RLS) nor dismiss via the compliance_dismiss() RPC (is_staff
        # guard), while a 'dispatcher' can do both.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/role_gate_compliance_test.sql

      - name: Audit-coverage tests (0454 · time_off_requests / receipt_uploads / coachings)
        # Asserts the three new audit triggers are wired and that an insert
        # into time_off_requests actually lands an audit_events row.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/audit_coverage_test.sql

      - name: Compliance-gate tests (0535 · EDV cert + license protection window)
        # The audit's root-cause fix for "a cert rule drifted out of the SQL
        # gates because nothing tested them." Asserts the three assignment
        # gates (staff_assign_violations / driver_can_take_shift /
        # driver_can_take_shift_after_swap) block an uncertified driver from a
        # requires_edv route, allow a certified one, exempt helper seats, and
        # enforce the license protection window when configured.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cert_gate_test.sql

      - name: MFA gate test (0540 · server-side assurance enforcement)
        # Proves the fail-safe (no-factor user never blocked, even with
        # require_mfa on), the fix (enrolled aal1 refused when opted in), and
        # backward-safety (require_mfa off => no change).
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/mfa_gate_test.sql

      - name: RPC role-gate test (0539 · privileged RPCs refuse driver-role)
        # Proves a driver-role app_user is refused (42501) on a sample of the
        # newly-gated SECURITY DEFINER functions (coaching/PTO/fleet/interview)
        # while a dispatcher passes — guards against a re-issue dropping the
        # role check.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rpc_role_gate_test.sql

      - name: Publish-gate test (0538 · driver schedule draft/publish)
        # Proves the opt-in finalize gate: default off returns every assigned
        # shift (backward-safe), on returns only finalized weeks, and
        # publishing a draft week reveals it.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/publish_gate_test.sql

      - name: Cross-tenant isolation test (customer-#1 pre-flight)
        # The core product promise: one tenant cannot read or write another's
        # data. Stands up TWO tenants and, dropped to the real `authenticated`
        # role, asserts Tenant A cannot see/insert/update/delete Tenant B's
        # drivers, I-9 documents, applicants, coachings, or SMS — while still
        # being able to write its own tenant. Permanent guard against a future
        # migration re-opening a cross-tenant hole.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/cross_tenant_isolation_test.sql

      - name: Tenant data-export tests (0472 · owner-only, tenant-scoped)
        # Asserts export_my_dsp_data() returns only the caller's tenant data and
        # that a dispatcher/driver cannot call it (owner-only portability/DSR).
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/data_export_test.sql

      - name: Usage-analytics RLS tests (0473 · self-bound insert, tenant-scoped read)
        # Asserts usage_events can't be spoofed across tenants/users and that a
        # tenant's staff see only their own events (non-staff see none).
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/usage_events_test.sql

      - name: Anon-RPC inventory gate (project-review PR#53)
        # Fails when a migration makes a NEW security-definer function
        # anon-executable that isn't on the reviewed allowlist — the
        # cross-tenant suite covers tables; this watches the RPC surface.
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          if [ -f supabase/tests/anon_rpc_inventory_test.sql ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/anon_rpc_inventory_test.sql
          else
            echo "anon_rpc_inventory_test.sql not present yet — skipping"
          fi

      - name: Demo seed applies cleanly (project-review PR#55)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          if [ -f supabase/seeds/seed_demo.sql ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seeds/seed_demo.sql
          else
            echo "seed_demo.sql not present yet — skipping"
          fi

      - name: Schema dump artifact (project-review PR#54)
        # pg_dump of the fully-migrated throwaway DB: reviewable schema
        # diffs per PR, a DR snapshot, and the input for an eventual
        # squash baseline (from migrations, never from drifted prod).
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump --schema-only --no-owner --no-privileges \
            -h 127.0.0.1 -p 54322 -U postgres postgres > /tmp/schema.sql || true
          wc -l /tmp/schema.sql || true

      - name: Upload schema dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-dump
          path: /tmp/schema.sql
          retention-days: 30
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: supabase stop --no-backup || true
