name: workbook-tests

# The dashboard workbook (formula engine, recalc, XLSX interop) has a Node test
# suite under scripts/ that nothing was running in CI. Gate it on changes to the
# workbook module or its tests so regressions are caught on the PR.
# Paths list every SOURCE the npm-test suites import, not just the test
# scripts: test-labor-forecast reads dashboard/forecast-core.js, the parts
# suites read dashboard/parts/**, and the receipt/scanner suites read
# app/app.js — previously edits to those sources ran zero relevant CI.
on:
  pull_request:
    paths:
      - "dashboard/workbook.js"
      - "dashboard/cal-tz.mjs"
      - "dashboard/ivcal-layout.js"
      - "dashboard/ivcal-slots.js"
      - "dashboard/forecast-core.js"
      - "dashboard/meet-core.js"
      - "dashboard/parts/**"
      - "app/app.js"
      - "tests/fixtures/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/workbook-tests.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/workbook.js"
      - "dashboard/cal-tz.mjs"
      - "dashboard/ivcal-layout.js"
      - "dashboard/ivcal-slots.js"
      - "dashboard/forecast-core.js"
      - "dashboard/meet-core.js"
      - "dashboard/parts/**"
      - "app/app.js"
      - "tests/fixtures/**"
      - "scripts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
