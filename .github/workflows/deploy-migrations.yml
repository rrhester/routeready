name: Deploy Supabase

# Pushes migrations + edge functions to the live project whenever something
# under supabase/ changes on main. Also runnable manually.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  - https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - DB password set when project was created
#   SUPABASE_PROJECT_REF   - doiwrhkirgblcvuskhno
#
# Edge function runtime secrets are set separately via
#   `supabase secrets set --project-ref … KEY=VAL`
# or the dashboard. See supabase/SECRETS.md for the full list.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push --include-all

      - name: Deploy edge functions (JWT-gated)
        run: |
          for fn in send-sms send-email send-driver-push cal-availability invite-team-member admin-delete-dsp; do
            echo "▶ deploying $fn (auth required)"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Deploy edge functions (public webhooks)
        run: |
          for fn in webhook-twilio webhook-cal webhook-apply webhook-email-inbound upload-applicant-video upload-driver-photo; do
            echo "▶ deploying $fn (no jwt)"
            supabase functions deploy "$fn" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          done
