name: Deploy Supabase

# Pushes migrations + edge functions to the live project whenever something
# under supabase/ changes on main. Also runnable manually.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  - https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - DB password set when project was created
#   SUPABASE_PROJECT_REF   - doiwrhkirgblcvuskhno
#
# Edge function runtime secrets are set separately via
#   `supabase secrets set --project-ref … KEY=VAL`
# or the dashboard. See supabase/SECRETS.md for the full list.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply DB migrations (idempotent runner)
        # `supabase db push` is unreliable here (the operator applies
        # migrations by hand, so schema_migrations has drifted). Instead we
        # use a self-contained runner that tracks applied files in
        # public.rr_migrations: it adopts everything <= a baseline as already
        # applied and runs only genuinely new migrations (authored
        # idempotently). No-ops if SUPABASE_DB_URL isn't set.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL not set — skipping auto-apply (add the secret to enable it)."
            exit 0
          fi
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          bash scripts/apply-migrations.sh

      - name: Deploy edge functions (JWT-gated, end-user callable)
        # Track per-function deploy outcomes.  The original simple `for`
        # loop would silently swallow individual function failures
        # because the loop's exit code is its last command's, not the
        # accumulated failure state.  That hid a broken deploy of
        # invite-team-member on 2026-05-09 (PR #622 ran green per the
        # workflow but the function was actually never updated).
        # Now we capture every failure + force the step (and the run)
        # to fail if any function couldn't deploy.
        #
        # send-email + send-sms moved to the --no-verify-jwt loop below.
        # After Supabase rotated this project to the new sb_secret_…
        # keys, the gateway stopped accepting the legacy JWT that the
        # drain cron + private.fire_message_send trigger pass through;
        # gating those two in-function via requireServiceKey() instead.
        #
        # Each deploy retries ×3 with backoff: bundling fetches
        # supabase-js from esm.sh, whose transient 522s failed two runs
        # on 2026-07-11 (finch-sync 20:55, invite-team-member +
        # notebook-ai 21:32) with no code change involved. A failed
        # function keeps its previous deployed version, so the real risk
        # is a genuine change silently staying undeployed — retries make
        # the common flake self-heal while real failures still fail.
        run: |
          set +e
          deploy_with_retry() {
            local fn="$1"; shift
            local attempt
            for attempt in 1 2 3; do
              if supabase functions deploy "$fn" "$@" --project-ref "$SUPABASE_PROJECT_REF"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::deploy attempt $attempt failed for $fn — retrying in $((attempt * 15))s"
                sleep $((attempt * 15))
              fi
            done
            return 1
          }
          failed=()
          for fn in send-driver-push send-staff-push meet-turn-credentials invite-team-member admin-delete-dsp google-oauth-start google-calendar-disconnect google-calendar-events google-drive-create google-drive-status dispatch-optimization-run finch-oauth-start finch-sync workbook-ai notebook-ai flex-capacity; do
            echo "▶ deploying $fn (auth required)"
            if ! deploy_with_retry "$fn"; then
              echo "::error::deploy failed for $fn"
              failed+=("$fn")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::JWT-gated function deploys failed for: ${failed[*]}"
            exit 1
          fi

      - name: Deploy edge functions (no-verify-jwt; bearer-gated in code)
        # Functions in this loop either accept signed-webhook payloads
        # (Twilio / Cal.com / Resend Svix), or are called server-to-server
        # by triggers + crons that present the service role key in a
        # bearer header. The functions check the bearer themselves via
        # requireServiceKey() — see supabase/functions/_shared/supabase.ts.
        # Same ×3 retry-with-backoff as the JWT-gated loop (esm.sh 522s).
        run: |
          set +e
          deploy_with_retry() {
            local fn="$1"; shift
            local attempt
            for attempt in 1 2 3; do
              if supabase functions deploy "$fn" "$@" --project-ref "$SUPABASE_PROJECT_REF"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::deploy attempt $attempt failed for $fn — retrying in $((attempt * 15))s"
                sleep $((attempt * 15))
              fi
            done
            return 1
          }
          failed=()
          for fn in send-email send-sms push-fanout livekit-token meet-turn-driver export-tenant-files health cal-availability webhook-twilio webhook-cal webhook-apply webhook-email-inbound upload-applicant-video upload-driver-photo driver-document-fetch document-verify document-classify dvic-ai-review desktop-pair ai-proxy box-ingest google-oauth-callback google-calendar-sync google-calendar-pull calendar-feed interview-room finch-oauth-callback repair-shop-portal; do
            echo "▶ deploying $fn (no jwt)"
            if ! deploy_with_retry "$fn" --no-verify-jwt; then
              echo "::error::deploy failed for $fn"
              failed+=("$fn")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Public-webhook function deploys failed for: ${failed[*]}"
            exit 1
          fi
