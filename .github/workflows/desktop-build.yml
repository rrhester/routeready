# RouteReady Desktop · cloud build pipeline.
#
# Why this exists: the operator dev's on a Chromebook, so building
# Electron installers locally isn't realistic. This workflow builds
# Mac / Windows / Linux installers in the cloud on every push that
# touches the desktop/ folder, and creates a GitHub Release with the
# installers attached when a tag like `desktop-v0.1.2` is pushed.
#
# Cost note: Linux + Windows runners are free on private repos under
# the GitHub Free tier's monthly minute allotment. macOS runners
# bill 10× the rate of Linux. If you don't ship to Mac yet, drop the
# `macos-latest` matrix entry.

name: desktop-build

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:  # manual build; set release_tag to also publish a release
    inputs:
      release_tag:
        description: "Publish a GitHub Release under this tag (e.g. desktop-v0.6.4). Leave blank to just build installers. Tag-push (desktop-v*) still publishes automatically; this is for when a tag can't be pushed directly."
        required: false
        default: ""

permissions:
  contents: write   # needed to create releases when a tag is pushed

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner builds installers for its native OS. Cross-
        # compiling Mac builds from Linux/Windows isn't reliable.
        #
        # macOS re-enabled: the Playwright "Chrome for Testing" Chromium
        # .app whose Versions/Current framework symlinks electron-builder
        # couldn't raw-copy (with asar:false) is now packed via the asar
        # packer + asarUnpack on mac only (see desktop/package.json `mac`),
        # which stores symlinks as archive entries. Win/Linux still build
        # with asar:false, untouched. main.js's resolver already checks
        # app.asar.unpacked for the mac Chromium path.
        os: [ubuntu-latest, windows-latest, macos-latest]

    # PLAYWRIGHT_BROWSERS_PATH=0 tells Playwright to install Chromium under
    # node_modules/playwright-core/.local-browsers/ rather than the global
    # ms-playwright cache. That way electron-builder's `files` glob picks it
    # up and the installer ships with Chromium inside it — without this, the
    # installed app can't find a browser at runtime and crashes on launch.
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        # npm ci against the committed lockfile — installers are now built
        # from pinned dependency trees instead of whatever electron ^32 /
        # playwright ^1.48 resolve to on build day.
        run: npm ci --no-audit --no-fund

      # electron-builder writes outputs to desktop/dist/. Mac produces
      # .dmg, Windows produces .exe (NSIS installer), Linux produces
      # .AppImage.
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        # macOS skips code signing here (CSC_IDENTITY_AUTO_DISCOVERY=false).
        # When you've got an Apple Developer cert + notarisation
        # secrets configured, drop the env block and electron-builder
        # picks them up automatically.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      # Push every successful build into the workflow run as an
      # artifact so the dev can grab the installer without waiting
      # for a release tag.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: routeready-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/*.yml
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/desktop-v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Manual dispatch with no tag typed: derive desktop-v<version>
            # from desktop/package.json so a release always publishes.
            VER="$(node -p "require('./desktop/package.json').version")"
            TAG="desktop-v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing release: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Tag from the input, the pushed tag, or derived from
          # package.json (manual dispatch with no tag typed). The tag is
          # auto-created at the dispatched commit if it doesn't exist.
          name: ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Glob across every platform's artifact dir.
          files: artifacts/**/*
          draft: false
          prerelease: false
          # Force latest=true. Without this, GitHub's "latest" detection
          # tries to semver-parse the tag — and our `desktop-v*` prefix
          # doesn't parse, so the API's /releases/latest endpoint 404s.
          # That breaks the static download links on gorouteready.com.
          make_latest: 'true'
          generate_release_notes: true
